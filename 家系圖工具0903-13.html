        g.appendChild(hitLine);

        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute('x1', lineStartX); line.setAttribute('y1', lineStartY);
        line.setAttribute('x2', lineEndX); line.setAttribute('y2', lineEndY);
        line.setAttribute('stroke', color); line.setAttribute('stroke-width', strokeSize);
        line.setAttribute('stroke-linecap', 'round');
        g.appendChild(line);

        function drawPoly(targetX, targetY, fromX, fromY) {
          let angle = Math.atan2(targetY - fromY, targetX - fromX);
          let p1x = targetX - arrowHeadSize * Math.cos(angle - Math.PI / 6);
          let p1y = targetY - arrowHeadSize * Math.sin(angle - Math.PI / 6);
          let p2x = targetX - arrowHeadSize * Math.cos(angle + Math.PI / 6);
          let p2y = targetY - arrowHeadSize * Math.sin(angle + Math.PI / 6);
          let poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          poly.setAttribute('points', `${targetX},${targetY} ${p1x},${p1y} ${p2x},${p2y}`);
          poly.setAttribute('fill', color);
          g.appendChild(poly);
        }

        if (type === 'arrow-single' || type === 'arrow-double') drawPoly(state.x2, state.y2, state.x1, state.y1);
        if (type === 'arrow-double') drawPoly(state.x1, state.y1, state.x2, state.y2);
      }
      else if (type === 'ellipse') {
        let actualX = state.w < 0 ? state.x + state.w : state.x;
        let actualY = state.h < 0 ? state.y + state.h : state.y;
        let actualW = Math.abs(state.w); let actualH = Math.abs(state.h);

        let hitEl = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
        hitEl.setAttribute('cx', actualX + actualW / 2); hitEl.setAttribute('cy', actualY + actualH / 2);
        hitEl.setAttribute('rx', actualW / 2); hitEl.setAttribute('ry', actualH / 2);
        hitEl.setAttribute('fill', 'none'); hitEl.setAttribute('stroke', 'transparent'); hitEl.setAttribute('stroke-width', Math.max(20, thickness + 16));
        g.appendChild(hitEl);

        let el = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
        el.setAttribute('cx', actualX + actualW / 2); el.setAttribute('cy', actualY + actualH / 2);
        el.setAttribute('rx', actualW / 2); el.setAttribute('ry', actualH / 2);
        // 修改：填色改用 data-fill（fillValue），'none' 時維持原本鏤空效果，
        // 選了顏色且取消勾選「透明」時才會真正填滿。
        el.setAttribute('stroke', color); el.setAttribute('stroke-width', Math.max(1, thickness)); el.setAttribute('fill', fillValue);
        g.appendChild(el);
      }
      else if (type === 'rect') {
        let actualX = state.w < 0 ? state.x + state.w : state.x;
        let actualY = state.h < 0 ? state.y + state.h : state.y;
        let actualW = Math.abs(state.w); let actualH = Math.abs(state.h);

        let hitEl = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        hitEl.setAttribute('x', actualX); hitEl.setAttribute('y', actualY);
        hitEl.setAttribute('width', actualW); hitEl.setAttribute('height', actualH);
        hitEl.setAttribute('fill', 'none'); hitEl.setAttribute('stroke', 'transparent'); hitEl.setAttribute('stroke-width', Math.max(20, thickness + 16));
        g.appendChild(hitEl);

        let el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        el.setAttribute('x', actualX); el.setAttribute('y', actualY);
        el.setAttribute('width', actualW); el.setAttribute('height', actualH);
        // 修改：填色改用 data-fill（fillValue），道理同橢圓。
        el.setAttribute('stroke', color); el.setAttribute('stroke-width', Math.max(1, thickness)); el.setAttribute('fill', fillValue);
        g.appendChild(el);
      }
      else if (type === 'sector') {
        // 新增：扇形（1/4圓）。以滑鼠按下的那一點 (state.x, state.y) 當作圓心／扇形頂點，
        // 拖曳決定 x 方向半徑(state.w)與 y 方向半徑(state.h)，兩者可正可負(決定往哪個方向展開)。
        // 用取樣描點(而非猜測 SVG arc 的 sweep-flag)手動畫出從角度0°到90°的橢圓弧，
        // 不管往哪個方向拖曳都一定能畫出正確、往外凸出的四分之一圓弧，不會畫反。
        let cx = state.x, cy = state.y;
        let signX = state.w < 0 ? -1 : 1, signY = state.h < 0 ? -1 : 1;
        let arx = Math.abs(state.w) || 0.01, ary = Math.abs(state.h) || 0.01;
        const N = 20;
        let d = `M ${cx} ${cy}`;
        for (let i = 0; i <= N; i++) {
          let ang = (i / N) * (Math.PI / 2);
          let px = cx + signX * arx * Math.cos(ang);
          let py = cy + signY * ary * Math.sin(ang);
          d += ` L ${px} ${py}`;
        }
        d += ' Z';

        let hitPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        hitPath.setAttribute('d', d);
        hitPath.setAttribute('fill', 'none'); hitPath.setAttribute('stroke', 'transparent'); hitPath.setAttribute('stroke-width', Math.max(20, thickness + 16));
        g.appendChild(hitPath);

        let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute('d', d);
        path.setAttribute('stroke', color); path.setAttribute('stroke-width', Math.max(1, thickness));
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('fill', fillValue);
        g.appendChild(path);
      }
      else if (type === 'cross') {
        let s = Math.max(5, size);

        let hitCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        hitCircle.setAttribute('cx', state.cx); hitCircle.setAttribute('cy', state.cy);
        hitCircle.setAttribute('r', s + 12); hitCircle.setAttribute('fill', 'transparent');
        g.appendChild(hitCircle);

        let l1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
        let l2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
        [l1, l2].forEach(l => { l.setAttribute('stroke', color); l.setAttribute('stroke-width', Math.max(1, thickness)); l.setAttribute('stroke-linecap', 'round'); });
        l1.setAttribute('x1', state.cx - s); l1.setAttribute('y1', state.cy - s); l1.setAttribute('x2', state.cx + s); l1.setAttribute('y2', state.cy + s);
        l2.setAttribute('x1', state.cx + s); l2.setAttribute('y1', state.cy - s); l2.setAttribute('x2', state.cx - s); l2.setAttribute('y2', state.cy + s);
        g.appendChild(l1); g.appendChild(l2);
      }
      else if (type === 'text') {
        let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute('x', state.x); text.setAttribute('y', state.y);
        text.setAttribute('fill', color);
        text.setAttribute('font-size', Math.max(10, size));
        text.setAttribute('font-family', font);
        let lines = (state.text || "").split('\n');
        lines.forEach((lineStr, i) => {
          let tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
          tspan.setAttribute('x', state.x); tspan.setAttribute('dy', i === 0 ? 0 : '1.2em');
          tspan.textContent = lineStr; text.appendChild(tspan);
        });
        text.style.userSelect = 'none'; g.appendChild(text);
      }
      else if (type === 'freehand') {
        let d = state.pts.map((p, i) => (i === 0 ? 'M' : 'L') + ` ${p[0]} ${p[1]}`).join(' ');

        let hitPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        hitPath.setAttribute('fill', 'none'); hitPath.setAttribute('stroke', 'transparent'); hitPath.setAttribute('stroke-width', Math.max(20, thickness + 16));
        hitPath.setAttribute('stroke-linecap', 'round'); hitPath.setAttribute('stroke-linejoin', 'round');
        hitPath.setAttribute('d', d);
        g.appendChild(hitPath);

        let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute('fill', 'none'); path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', thickness); path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('d', d); g.appendChild(path);
      }
      else if (type === 'cohabit-draw') {
        let hitPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        hitPath.setAttribute('fill', 'none'); hitPath.setAttribute('stroke', 'transparent'); hitPath.setAttribute('stroke-width', Math.max(20, thickness + 16));
        hitPath.setAttribute('stroke-linecap', 'round'); hitPath.setAttribute('stroke-linejoin', 'round');

        let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute('fill', 'none'); path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', Math.max(1, thickness));
        path.removeAttribute('stroke-dasharray');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');

        if (state.isFinished) {
          let d = buildSmoothClosedPath(state.pts);
          path.setAttribute('d', d);
          hitPath.setAttribute('d', d);
        } else {
          let d = state.pts.map((p, i) => (i === 0 ? 'M' : 'L') + ` ${p[0]} ${p[1]}`).join(' ');
          path.setAttribute('d', d);
          hitPath.setAttribute('d', d);
        }
        g.appendChild(hitPath);
        g.appendChild(path);
      }
    }

    function applyTransform(el) {
      let tx = parseFloat(el.getAttribute('data-tx') || 0); let ty = parseFloat(el.getAttribute('data-ty') || 0);
      let rot = parseFloat(el.getAttribute('data-rot') || 0);
      try {
        let bbox = el.getBBox();
        let cx = bbox.x + bbox.width / 2; let cy = bbox.y + bbox.height / 2;
        el.setAttribute('transform', `translate(${tx}, ${ty}) translate(${cx}, ${cy}) rotate(${rot}) translate(${-cx}, ${-cy})`);
      } catch (e) { }
    }

    // 將某元素「本地座標系」上的一點，換算成畫布(svg viewBox)座標，
    // 讓拉框選取可以用物件實際幾何形狀(而非外接矩形)來判斷是否被框到
    function getLocalPointOnCanvas(el, lx, ly) {
      try {
        let elCTM = el.getScreenCTM();
        let svgCTM = svg.getScreenCTM();
        if (!elCTM || !svgCTM) return { x: lx, y: ly };
        let pt = svg.createSVGPoint();
        pt.x = lx; pt.y = ly;
        let screenPt = pt.matrixTransform(elCTM);
        return { x: (screenPt.x - svgCTM.e) / svgCTM.a, y: (screenPt.y - svgCTM.f) / svgCTM.d };
      } catch (e) { return { x: lx, y: ly }; }
    }

    function segmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
      let rx2 = rx + rw, ry2 = ry + rh;
      if ((x1 >= rx && x1 <= rx2 && y1 >= ry && y1 <= ry2) ||
        (x2 >= rx && x2 <= rx2 && y2 >= ry && y2 <= ry2)) return true;
      function segInt(ax, ay, bx2, by2, cx, cy, dx, dy) {
        let d1 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
        let d2 = (dx - cx) * (by2 - cy) - (dy - cy) * (bx2 - cx);
        let d3 = (bx2 - ax) * (cy - ay) - (by2 - ay) * (cx - ax);
        let d4 = (bx2 - ax) * (dy - ay) - (by2 - ay) * (dx - ax);
        return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
      }
      if (segInt(x1, y1, x2, y2, rx, ry, rx2, ry)) return true;
      if (segInt(x1, y1, x2, y2, rx2, ry, rx2, ry2)) return true;
      if (segInt(x1, y1, x2, y2, rx2, ry2, rx, ry2)) return true;
      if (segInt(x1, y1, x2, y2, rx, ry2, rx, ry)) return true;
      return false;
    }

    function bboxIntersectsRect(el, bx, by, bw, bh) {
      // 修正：el.getBBox() 回傳的是「尚未套用該元素自己 transform（含 data-tx/
      // data-ty 平移、data-rot 旋轉）之前」的本地座標。從自繪物件儲存庫「加入」
      // 或「貼上」產生的物件，都是額外用 transform 位移到新位置（原本的
      // data-state x/y 座標其實還是舊位置），所以直接拿 getBBox() 的原始座標
      // 去跟框選矩形比較，比對到的其實是「位移之前」的舊位置，造成矩形選取
      // 抓不到剛加入/貼上的物件；一般用滑鼠直接拖曳過的物件因為是直接改寫
      // data-state 座標、沒有額外 transform，所以沒發現這個問題。
      // 這裡改成用 getScreenCTM() 把本地 bbox 的四個角落換算成畫布座標後再比較，
      // 這樣物件本身、或其所在的上層群組（組合）套用的任何平移/旋轉都會被正確
      // 考慮進去，跟 getLocalPointOnCanvas() 用的是同一套換算方式。
      try {
        let bbox = el.getBBox();
        let elCTM = el.getScreenCTM();
        let svgCTM = svg.getScreenCTM();
        if (!elCTM || !svgCTM) return false;
        let corners = [
          [bbox.x, bbox.y], [bbox.x + bbox.width, bbox.y],
          [bbox.x, bbox.y + bbox.height], [bbox.x + bbox.width, bbox.y + bbox.height]
        ].map(([lx, ly]) => {
          let pt = svg.createSVGPoint(); pt.x = lx; pt.y = ly;
          let sp = pt.matrixTransform(elCTM);
          return { x: (sp.x - svgCTM.e) / svgCTM.a, y: (sp.y - svgCTM.f) / svgCTM.d };
        });
        let minX = Math.min(corners[0].x, corners[1].x, corners[2].x, corners[3].x);
        let maxX = Math.max(corners[0].x, corners[1].x, corners[2].x, corners[3].x);
        let minY = Math.min(corners[0].y, corners[1].y, corners[2].y, corners[3].y);
        let maxY = Math.max(corners[0].y, corners[1].y, corners[2].y, corners[3].y);
        return !(minX > bx + bw || maxX < bx || minY > by + bh || maxY < by);
      } catch (e) { return false; }
    }

    function shapeIntersectsBox(el, bx, by, bw, bh) {
      // 先用外接矩形做快速排除：矩形都不相交，實際形狀必定也不相交
      if (!bboxIntersectsRect(el, bx, by, bw, bh)) return false;

      let type = el.getAttribute('data-type');
      if (type === 'group') {
        let children = Array.from(el.children).filter(c => c.classList && c.classList.contains('custom-element'));
        return children.some(child => shapeIntersectsBox(child, bx, by, bw, bh));
      }

      let stateStr = el.getAttribute('data-state');
      if (!stateStr) return true; // 沒有 state 資料的類型，退回外接矩形判斷(上面已確認相交)
      let state;
      try { state = JSON.parse(stateStr); } catch (e) { return true; }
      if (!state) return true;

      if (type === 'line' || type === 'arrow-single' || type === 'arrow-double') {
        let p1 = getLocalPointOnCanvas(el, state.x1, state.y1);
        let p2 = getLocalPointOnCanvas(el, state.x2, state.y2);
        return segmentIntersectsRect(p1.x, p1.y, p2.x, p2.y, bx, by, bw, bh);
      }
      if (type === 'cross') {
        let s = Math.max(5, parseFloat(el.getAttribute('data-size')) || 16);
        let a1 = getLocalPointOnCanvas(el, state.cx - s, state.cy - s);
        let a2 = getLocalPointOnCanvas(el, state.cx + s, state.cy + s);
        let b1 = getLocalPointOnCanvas(el, state.cx + s, state.cy - s);
        let b2 = getLocalPointOnCanvas(el, state.cx - s, state.cy + s);
        return segmentIntersectsRect(a1.x, a1.y, a2.x, a2.y, bx, by, bw, bh) ||
          segmentIntersectsRect(b1.x, b1.y, b2.x, b2.y, bx, by, bw, bh);
      }
      if (type === 'ellipse') {
        let actualX = state.w < 0 ? state.x + state.w : state.x;
        let actualY = state.h < 0 ? state.y + state.h : state.y;
        let actualW = Math.abs(state.w); let actualH = Math.abs(state.h);
        let cx = actualX + actualW / 2; let cy = actualY + actualH / 2;
        let rx = actualW / 2; let ry = actualH / 2;
        let N = 24;
        let pts = [];
        for (let i = 0; i < N; i++) {
          let ang = (i / N) * Math.PI * 2;
          pts.push(getLocalPointOnCanvas(el, cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)));
        }
        for (let i = 0; i < N; i++) {
          let a = pts[i], b = pts[(i + 1) % N];
          if (segmentIntersectsRect(a.x, a.y, b.x, b.y, bx, by, bw, bh)) return true;
        }
        return false;
      }
      if (type === 'sector') {
        // 新增：扇形的精確框選判斷，用法跟橢圓一樣，沿著頂點+弧線描出的多邊形邊界
        // 逐段檢查是否與選取框相交，跟 renderShape() 裡畫出來的形狀是同一套算法，
        // 確保「看起來有沒有被框到」跟「實際判定有沒有被框到」一致。
        let cx = state.x, cy = state.y;
        let signX = state.w < 0 ? -1 : 1, signY = state.h < 0 ? -1 : 1;
        let arx = Math.abs(state.w) || 0.01, ary = Math.abs(state.h) || 0.01;
        let N = 20;
        let pts = [getLocalPointOnCanvas(el, cx, cy)];
        for (let i = 0; i <= N; i++) {
          let ang = (i / N) * (Math.PI / 2);
          pts.push(getLocalPointOnCanvas(el, cx + signX * arx * Math.cos(ang), cy + signY * ary * Math.sin(ang)));
        }
        for (let i = 0; i < pts.length; i++) {
          let a = pts[i], b = pts[(i + 1) % pts.length];
          if (segmentIntersectsRect(a.x, a.y, b.x, b.y, bx, by, bw, bh)) return true;
        }
        return false;
      }
      if (type === 'freehand' || type === 'cohabit-draw') {
        let rawPts = state.pts || [];
        let pts = rawPts.map(p => getLocalPointOnCanvas(el, p[0], p[1]));
        if (pts.length < 2) {
          return pts.length === 1 && pts[0].x >= bx && pts[0].x <= bx + bw && pts[0].y >= by && pts[0].y <= by + bh;
        }
        for (let i = 0; i < pts.length - 1; i++) {
          if (segmentIntersectsRect(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, bx, by, bw, bh)) return true;
        }
        if (type === 'cohabit-draw' && state.isFinished && pts.length > 2) {
          let last = pts[pts.length - 1], first = pts[0];
          if (segmentIntersectsRect(last.x, last.y, first.x, first.y, bx, by, bw, bh)) return true;
        }
        return false;
      }
      // text 及其他未特別處理的類型，退回外接矩形判斷(上面已確認相交)
      return true;
    }

    // 控制點（四角縮放用的藍色圓圈）半徑固定寫死在 SVG 座標系中，畫布放大/縮小（viewBox 改變）時
    // 瀏覽器會依比例把整個 SVG 內容（含控制點）一起放大縮小，導致放大畫布時控制點看起來變得很大顆。
    // 這裡依「目前 viewBox 寬度」相對於「基準寬度」反向調整控制點半徑，讓控制點在螢幕上的實際大小
    // 不論畫布怎麼縮放都盡量維持一致（放大畫布時控制點的 SVG 半徑同步縮小，抵銷掉整體放大的效果）。
    function getHandleScale() {
      let baseW = window.stylePanelBaseViewW || (window.currentViewBox ? window.currentViewBox.w : 1200);
      let curW = (window.currentViewBox && baseW) ? window.currentViewBox.w : baseW;
      let s = baseW ? (curW / baseW) : 1;
      return Math.min(2, Math.max(0.4, s));
    }

    function createHandle(x, y, cursor, action, targetId, targetEl) {
      let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.style.cursor = cursor;
      g.classList.add('control-handle');
      g.setAttribute('data-action', action);
      g.setAttribute('data-target', targetId);
      // 修正：除了保留 data-target（id 字串，僅供除錯/相容用），額外直接把
      // 「被選取的那個 DOM 元素本身」存成 JS 屬性。之後拖曳控制點時改用這個
      // 直接參考，不再透過 document.getElementById(id) 反查——這樣即使兩個
      // 自繪物件不小心 id 重複，也不會抓錯物件、動到別的形狀。
      g.__targetEl = targetEl;

      let hScale = getHandleScale();

      let hit = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      hit.setAttribute('cx', x); hit.setAttribute('cy', y); hit.setAttribute('r', 20 * hScale);
      hit.setAttribute('fill', 'transparent');
      g.appendChild(hit);

      let h = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      h.setAttribute('cx', x); h.setAttribute('cy', y); h.setAttribute('r', 6 * hScale);
      h.setAttribute('fill', '#ffffff'); h.setAttribute('stroke', '#007bff');
      h.setAttribute('stroke-width', String(2 * hScale));
      h.classList.add('control-handle-visual');
      g.appendChild(h);

      return g;
    }

    function renderControls() {
      controlsLayer.innerHTML = '';
      if (selectedEls.size !== 1) return;

      let target = Array.from(selectedEls)[0];
      let type = target.getAttribute('data-type');
      if (type === 'group' || type === 'freehand' || type === 'cohabit-draw') return;

      let stateStr = target.getAttribute('data-state');
      if (!stateStr) return;
      let state = JSON.parse(stateStr);
      let tId = target.getAttribute('id');

      let currentTransform = target.getAttribute('transform');
      if (currentTransform) controlsLayer.setAttribute('transform', currentTransform);
      else controlsLayer.removeAttribute('transform');

      if (type === 'line' || type === 'arrow-single' || type === 'arrow-double') {
        controlsLayer.appendChild(createHandle(state.x1, state.y1, 'pointer', 'p1', tId, target));
        controlsLayer.appendChild(createHandle(state.x2, state.y2, 'pointer', 'p2', tId, target));
      }
      else if (type === 'ellipse' || type === 'rect' || type === 'sector') {
        let tL = createHandle(state.x, state.y, 'nwse-resize', 'tl', tId, target);
        let tR = createHandle(state.x + state.w, state.y, 'nesw-resize', 'tr', tId, target);
        let bL = createHandle(state.x, state.y + state.h, 'nesw-resize', 'bl', tId, target);
        let bR = createHandle(state.x + state.w, state.y + state.h, 'nwse-resize', 'br', tId, target);
        controlsLayer.appendChild(tL); controlsLayer.appendChild(tR);
        controlsLayer.appendChild(bL); controlsLayer.appendChild(bR);
      }
    }

    function toggleSelect(el, evt) {
      if (!el) {
        if (!evt || !evt.shiftKey) { 
          selectedEls.forEach(e => e.classList.remove('selected-el')); 
          selectedEls.clear(); 
          selectedPeopleIds.clear();
          selectedMarriageKey = null;
          autoLayer.querySelectorAll('.selected-el').forEach(e => e.classList.remove('selected-el'));
        }
        renderControls();
        syncStylePanel();
        return;
      }

      let customParent = el.closest('.custom-element');
      while (customParent && customParent.parentElement && customParent.parentElement.classList.contains('custom-element')) {
        customParent = customParent.parentElement;
      }

      if (evt && evt.shiftKey) {
        if (selectedEls.has(customParent)) { customParent.classList.remove('selected-el'); selectedEls.delete(customParent); }
        else { customParent.classList.add('selected-el'); selectedEls.add(customParent); }
      } else {
        if (!selectedEls.has(customParent)) {
          selectedEls.forEach(e => e.classList.remove('selected-el')); selectedEls.clear();
          selectedPeopleIds.clear();
          selectedMarriageKey = null;
          autoLayer.querySelectorAll('.selected-el').forEach(e => e.classList.remove('selected-el'));
          
          customParent.classList.add('selected-el'); selectedEls.add(customParent);
        }
      }

      syncToolbarWithSelection();
      syncStylePanel();
      renderControls();
    }

    function syncToolbarWithSelection() {
      if (selectedEls.size === 1) {
        let el = Array.from(selectedEls)[0];
        let color = el.getAttribute('data-color');
        if (color) document.getElementById('draw-color').value = color;

        let size = el.getAttribute('data-size');
        if (size) document.getElementById('draw-size').value = parseFloat(size);

        let thickness = el.getAttribute('data-thickness');
        if (thickness) document.getElementById('draw-thickness').value = parseFloat(thickness);

        let font = el.getAttribute('data-font');
        if (font) document.getElementById('draw-font').value = font;

        // 新增：把選取物件目前的填色狀態同步回工具列（僅矩形/橢圓/扇形才有意義，
        // 其餘類型沒有 data-fill 或恆為 'none'，同步後「透明」勾選會自動打勾）。
        let fillAttr = el.getAttribute('data-fill');
        let transparentEl = document.getElementById('draw-fill-transparent');
        let fillColorEl = document.getElementById('draw-fill-color');
        if (transparentEl && fillColorEl) {
          if (!fillAttr || fillAttr === 'none') {
            transparentEl.checked = true;
          } else {
            transparentEl.checked = false;
            fillColorEl.value = fillAttr;
          }
        }
      }
    }

    function applyStyleSelected() {
      let color = document.getElementById('draw-color').value;
      let size = document.getElementById('draw-size').value;
      let thickness = document.getElementById('draw-thickness').value;
      let font = document.getElementById('draw-font').value;
      // 新增：目前工具列的填色設定，套用到選取物件身上（對線條/文字等無內部面積
      // 的類型設定這個屬性沒有作用，不影響原本外觀）。
      let fill = getCurrentFillValue();

      // 新增：若目前選取的是「手動建立的自訂關係線」，改色時直接套用到該線段本身（marriageLineStyles），
      // 不影響一般婚姻線／親子線（固定黑色）
      if (selectedMarriageKey && selectedMarriageKey.indexOf('manual__') === 0) {
        if (!marriageLineStyles[selectedMarriageKey]) marriageLineStyles[selectedMarriageKey] = {};
        marriageLineStyles[selectedMarriageKey].color = color;
        renderGenogram();
        clearTimeout(window.__applyStyleCommitTimer);
        window.__applyStyleCommitTimer = setTimeout(commitHistory, 400);
        return;
      }

      selectedEls.forEach(el => {
        if (el.getAttribute('data-type') !== 'group') {
          el.setAttribute('data-color', color);
          el.setAttribute('data-size', size);
          el.setAttribute('data-thickness', thickness);
          el.setAttribute('data-font', font);
          el.setAttribute('data-fill', fill);
          renderShape(el);
        } else {
          el.querySelectorAll('.custom-element').forEach(child => {
            child.setAttribute('data-color', color);
            child.setAttribute('data-size', size);
            child.setAttribute('data-thickness', thickness);
            child.setAttribute('data-font', font);
            child.setAttribute('data-fill', fill);
            renderShape(child);
          });
        }
      });
      renderControls();
      clearTimeout(window.__applyStyleCommitTimer);
      window.__applyStyleCommitTimer = setTimeout(commitHistory, 400);
    }

    function cancelOneFingerOperations() {
      if (isBoxSelecting) {
        isBoxSelecting = false;
        boxSelectStartPt = null;
        if (selectionBoxRect) selectionBoxRect.style.display = 'none';
      }
      if (isDrawing && currentDrawEl) {
        currentDrawEl.remove();
        currentDrawEl = null;
      }
      isDrawing = false;
      startPt = null;
      activeHandleAction = null;
      activeHandleTarget = null;
      handleStartPt = null;
    }

    let touchStartViewBox = null;
    let initialPinchDist = 0;
    let initialPinchMid = null;
    let isMultiTouch = false;

    svg.addEventListener('touchstart', function (e) {
      if (e.touches.length >= 2) {
        e.preventDefault(); 
        isMultiTouch = true;
        cancelOneFingerOperations(); 

        let t1 = e.touches[0];
        let t2 = e.touches[1];
        initialPinchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        initialPinchMid = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };
        if (window.currentViewBox) {
          touchStartViewBox = { ...window.currentViewBox };
        }
      }
    }, { passive: false });

    svg.addEventListener('touchmove', function (e) {
      if (isMultiTouch && e.touches.length >= 2 && touchStartViewBox) {
        e.preventDefault();
        let t1 = e.touches[0];
        let t2 = e.touches[1];
        let currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        let currentMid = {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };

        if (currentDist === 0) currentDist = 0.1;
        let zoomFactor = initialPinchDist / currentDist; 

        let rect = svg.getBoundingClientRect();
        let scaleX = touchStartViewBox.w / rect.width;
        let scaleY = touchStartViewBox.h / rect.height;

        let newW = touchStartViewBox.w * zoomFactor;
        let newH = touchStartViewBox.h * zoomFactor;

        let svgMidX = touchStartViewBox.x + (initialPinchMid.x - rect.left) * scaleX;
        let svgMidY = touchStartViewBox.y + (initialPinchMid.y - rect.top) * scaleY;

        let newScaleX = newW / rect.width;
        let newScaleY = newH / rect.height;

        let newX = svgMidX - (currentMid.x - rect.left) * newScaleX;
        let newY = svgMidY - (currentMid.y - rect.top) * newScaleY;

        window.currentViewBox.x = newX;
        window.currentViewBox.y = newY;
        window.currentViewBox.w = newW;
        window.currentViewBox.h = newH;

        svg.setAttribute("viewBox", `${window.currentViewBox.x} ${window.currentViewBox.y} ${window.currentViewBox.w} ${window.currentViewBox.h}`);
        updateStylePanelZoomScale();
        renderControls();
      }
    }, { passive: false });

    svg.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) {
        isMultiTouch = false;
      }
    });

    let lastPointerDownTime = 0;
    let lastPointerDownTarget = null;

    function handleDoubleClickLogic(target) {
      // 連結其他人狀態鎖定中：雙擊也視同一般點擊處理（不觸發文字編輯等其他操作），
      // 交由 pointerdown 最上方的連結判斷邏輯統一處理完成／取消
      if (manualLinkSourceId) return;
      let mode = document.getElementById('draw-mode').value;
      if (mode !== 'select') return;
      let customParent = target.closest('.custom-element');
      if (customParent && customParent.getAttribute('data-type') === 'text') {
        let state = JSON.parse(customParent.getAttribute('data-state'));
        customPrompt("編輯標註文字 (可多行):", function (newText) {
          if (newText !== null) {
            state.text = newText;
            customParent.setAttribute('data-state', JSON.stringify(state));
            renderShape(customParent);
            renderControls();
            commitHistory();
          }
        }, state.text);
      }
    }

    svg.addEventListener('dblclick', function (evt) {
      handleDoubleClickLogic(evt.target);
    });

    svg.addEventListener('pointerdown', function (evt) {
      if (!evt.isPrimary || isMultiTouch) return;
      try { svg.setPointerCapture(evt.pointerId); } catch (e) { }

      // ★「連結其他人」狀態鎖定中：最優先處理，畫面上任何一次點擊都只用來完成連結或取消，
      // 不會再往下執行雙擊／右鍵選單／畫布平移／選取拖曳等其他任何操作。
      // 點到人物節點＝完成連結；點到其他任何地方（畫布空白處）＝取消此狀態。
      if (manualLinkSourceId) {
        evt.preventDefault();
        let targetNodeGroup = evt.target.closest('.draggable-node');
        if (targetNodeGroup) {
          let targetId = targetNodeGroup.getAttribute('data-person-id');
          if (targetId !== manualLinkSourceId) {
            let already = manualLinks.find(l => (l.from === manualLinkSourceId && l.to === targetId) || (l.from === targetId && l.to === manualLinkSourceId));
            let newKey;
            if (already) {
              newKey = 'manual__' + already.id;
            } else {
              let newId = 'ml' + (manualLinkIdCounter++);
              manualLinks.push({ id: newId, from: manualLinkSourceId, to: targetId });
              newKey = 'manual__' + newId;
            }
            selectedEls.forEach(e => e.classList.remove('selected-el')); selectedEls.clear();
            selectedPeopleIds.clear();
            selectedMarriageKey = newKey;
            renderGenogram(); renderControls();
            commitHistory();
          }
        }
        manualLinkSourceId = null;
        svg.classList.remove('link-picking-cursor');
        document.body.classList.remove('link-picking-lock');
        syncStylePanel();
        return;
      }

      let currentTime = new Date().getTime();
      let timeDiff = currentTime - lastPointerDownTime;
      if (timeDiff > 0 && timeDiff < 300 && lastPointerDownTarget === evt.target) {
        handleDoubleClickLogic(evt.target);
        lastPointerDownTime = 0;
        return;
      }
      lastPointerDownTime = currentTime;
      lastPointerDownTarget = evt.target;

      if (evt.button === 2) {
        // 新增：右鍵點擊人物圖案／自訂關係線可隨時使用「連結其他關係」／刪除，不需先展開樣式面板；
        // 其餘情況（右鍵點擊空白處）維持原本右鍵拖曳畫布平移的行為
        let rightClickNode = evt.target.closest('.draggable-node');
        if (rightClickNode) {
          evt.preventDefault();
          showPersonLinkContextMenu(evt, rightClickNode.getAttribute('data-person-id'));
          return;
        }
        let rightClickManualLink = evt.target.closest('.manual-link-group');
        if (rightClickManualLink) {
          evt.preventDefault();
          showManualLinkContextMenu(evt, rightClickManualLink.getAttribute('data-manual-id'));
          return;
        }
        isCanvasPanning = true;
        canvasPanStart = { x: evt.clientX, y: evt.clientY };
        viewBoxStart = { x: window.currentViewBox.x, y: window.currentViewBox.y };
        svg.style.cursor = 'grabbing';
        return;
      }

      // 右側樣式面板套用邏輯：啟用某個樣式模式後，點選畫布上對應的人物圖案或婚姻線即可套用／再次點選同一物件可取消
      if (activeStyleMode) {
        if (activeStyleMode === 'shape-double' || activeStyleMode === 'shape-quarter') {
          let styleNodeGroup = evt.target.closest('.draggable-node');
          if (styleNodeGroup) {
            let pId = styleNodeGroup.getAttribute('data-person-id');
            let person = people.find(x => x.id === pId);
            if (person) {
              if (activeStyleMode === 'shape-double') person.styleDoubleRing = !person.styleDoubleRing;
              else person.styleQuarterShade = !person.styleQuarterShade;
              renderGenogram();
              commitHistory();
            }
          }
        } else {
          let marriageGroup = evt.target.closest('.marriage-line-group');
          if (marriageGroup) {
            let mKey = marriageGroup.getAttribute('data-pair-key');
            if (!marriageLineStyles[mKey]) marriageLineStyles[mKey] = {};
            let flag = activeStyleMode.replace('line-', '');
            marriageLineStyles[mKey][flag] = !marriageLineStyles[mKey][flag];
            renderGenogram();
            commitHistory();
          }
        }
        return;
      }

      let mode = document.getElementById('draw-mode').value;
      let color = document.getElementById('draw-color').value;
      let size = document.getElementById('draw-size').value;
      let thickness = document.getElementById('draw-thickness').value;
      let font = document.getElementById('draw-font').value;
      let fill = getCurrentFillValue();
      let pos = getMousePos(evt);

      let handle = evt.target.closest('.control-handle');
      if (handle) {
        activeHandleAction = handle.getAttribute('data-action');
        // 修正：優先使用建立控制點時直接存下的 DOM 元素參考（__targetEl），
        // 避免用 id 字串經 document.getElementById() 反查——當畫布上剛好有
        // 另一個 id 重複的自繪物件時，getElementById 只會回傳「第一個」符合
        // 的元素，會導致拖曳控制點時改動到錯誤的物件。只有在極少數沒有
        // __targetEl（例如舊格式資料）時才退回原本的 id 查找方式。
        activeHandleTarget = handle.__targetEl || document.getElementById(handle.getAttribute('data-target'));
        handleStartPt = pos;
        return;
      }

      let nodeGroup = evt.target.closest('.draggable-node');
      let customParent = evt.target.closest('.custom-element');

      if (mode === 'select') {
        if (nodeGroup) {
          let pId = nodeGroup.getAttribute('data-person-id');
          if (evt.shiftKey) {
            if (selectedPeopleIds.has(pId)) {
              selectedPeopleIds.delete(pId);
              nodeGroup.classList.remove('selected-el');
            } else {
              selectedPeopleIds.add(pId);
              nodeGroup.classList.add('selected-el');
            }
          } else {
            if (!selectedPeopleIds.has(pId)) {
              toggleSelect(null, evt); 
              selectedPeopleIds.add(pId);
              nodeGroup.classList.add('selected-el');
            }
          }
          selectedMarriageKey = null;
          syncToolbarWithSelection();
          syncStylePanel();
          renderControls();
          if (selectedPeopleIds.has(pId)) scrollToPersonRow(pId);
          isDrawing = true; 
          startPt = pos;
          return;
        }

        if (customParent) {
          toggleSelect(evt.target, evt); 
          isDrawing = true; 
          startPt = pos;
          return;
        }

        // 新增：於選取模式下點選婚姻線，直接選取該關係線段（單選，紅色外框顯示，右側面板同步顯示目前樣式狀態）
        // 若樣式面板已收合（styleLineSelectDisabled），則暫停此點選選取功能，視同點選空白畫布，滑鼠維持一般選取行為
        let marriageGroupClicked = evt.target.closest('.marriage-line-group');
        if (marriageGroupClicked && !evt.shiftKey && !styleLineSelectDisabled) {
          let mKey = marriageGroupClicked.getAttribute('data-pair-key');
          selectedEls.forEach(e => e.classList.remove('selected-el'));
          selectedEls.clear();
          selectedPeopleIds.clear();
          autoLayer.querySelectorAll('.selected-el').forEach(e => e.classList.remove('selected-el'));
          selectedMarriageKey = (selectedMarriageKey === mKey) ? null : mKey;
          renderGenogram();
          renderControls();
          syncStylePanel();
          return;
        }

        if (!evt.shiftKey) {
          toggleSelect(null, evt);
        }
        isBoxSelecting = true;
        boxSelectStartPt = pos;
        if (!selectionBoxRect) {
          selectionBoxRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          selectionBoxRect.setAttribute('fill', 'rgba(0, 123, 255, 0.15)');
          selectionBoxRect.setAttribute('stroke', '#007bff');
          selectionBoxRect.setAttribute('stroke-width', '1');
          selectionBoxRect.setAttribute('stroke-dasharray', '4,4');
          selectionBoxLayer.appendChild(selectionBoxRect);
        }
        selectionBoxRect.setAttribute('x', pos.x);
        selectionBoxRect.setAttribute('y', pos.y);
        selectionBoxRect.setAttribute('width', 0);
        selectionBoxRect.setAttribute('height', 0);
        selectionBoxRect.style.display = 'block';
      }
      else if (mode === 'text') {
        customPrompt("請輸入標註文字 (可多行):", function (textStr) {
          if (textStr) {
            let state = { x: pos.x, y: pos.y, text: textStr };
            let g = createCustomElement('text', state, color, size, thickness, font);
            renderShape(g); customLayer.appendChild(g);
            setTimeout(() => { toggleSelect(g); }, 10);
            commitHistory();
          }
          document.getElementById('draw-mode').value = 'select';
        });
      }
      else if (mode === 'cross') {
        let state = { cx: pos.x, cy: pos.y };
        let g = createCustomElement('cross', state, color, size, thickness);
        renderShape(g); customLayer.appendChild(g);
        setTimeout(() => { toggleSelect(g); document.getElementById('draw-mode').value = 'select'; }, 10);
        commitHistory();
      }
      else if (mode === 'ellipse') {
        isDrawing = true; startPt = pos;
        let state = { x: pos.x, y: pos.y, w: 0, h: 0 };
        currentDrawEl = createCustomElement('ellipse', state, color, size, thickness, null, fill);
        renderShape(currentDrawEl); customLayer.appendChild(currentDrawEl);
      }
      else if (mode === 'rect') {
        isDrawing = true; startPt = pos;
        let state = { x: pos.x, y: pos.y, w: 0, h: 0 };
        currentDrawEl = createCustomElement('rect', state, color, size, thickness, null, fill);
        renderShape(currentDrawEl); customLayer.appendChild(currentDrawEl);
      }
      else if (mode === 'sector') {
        // 新增：扇形(1/4圓)。點下去的位置當作頂點，之後拖曳決定兩個方向的半徑大小。
        isDrawing = true; startPt = pos;
        let state = { x: pos.x, y: pos.y, w: 0, h: 0 };
        currentDrawEl = createCustomElement('sector', state, color, size, thickness, null, fill);
        renderShape(currentDrawEl); customLayer.appendChild(currentDrawEl);
      }
      else if (mode === 'freehand') {
        isDrawing = true;
        let state = { pts: [[pos.x, pos.y]] };
        currentDrawEl = createCustomElement('freehand', state, color, size, thickness);
        renderShape(currentDrawEl); customLayer.appendChild(currentDrawEl);
      }
      else if (mode === 'cohabit-draw') {
        isDrawing = true;
        let state = { pts: [[pos.x, pos.y]], isFinished: false };
        currentDrawEl = createCustomElement('cohabit-draw', state, color, size, thickness);
        renderShape(currentDrawEl); customLayer.appendChild(currentDrawEl);
      }
      else if (mode === 'line' || mode === 'arrow-single' || mode === 'arrow-double') {
        isDrawing = true; startPt = pos;
        let state = { x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y };
        currentDrawEl = createCustomElement(mode, state, color, size, thickness);
        renderShape(currentDrawEl); customLayer.appendChild(currentDrawEl);
      }
    });

    svg.addEventListener('pointermove', function (evt) {
      if (!evt.isPrimary || isMultiTouch) return;

      if (isCanvasPanning) {
        let rect = svg.getBoundingClientRect();
        let scaleX = window.currentViewBox.w / rect.width;
        let scaleY = window.currentViewBox.h / rect.height;
        let dx = (evt.clientX - canvasPanStart.x) * scaleX;
        let dy = (evt.clientY - canvasPanStart.y) * scaleY;
        window.currentViewBox.x = viewBoxStart.x - dx;
        window.currentViewBox.y = viewBoxStart.y - dy;
        svg.setAttribute("viewBox", `${window.currentViewBox.x} ${window.currentViewBox.y} ${window.currentViewBox.w} ${window.currentViewBox.h}`);
        return;
      }

      let pos = getMousePos(evt);

      if (isBoxSelecting && boxSelectStartPt && selectionBoxRect) {
        let bx = Math.min(boxSelectStartPt.x, pos.x);
        let by = Math.min(boxSelectStartPt.y, pos.y);
        let bw = Math.abs(pos.x - boxSelectStartPt.x);
        let bh = Math.abs(pos.y - boxSelectStartPt.y);

        selectionBoxRect.setAttribute('x', bx);
        selectionBoxRect.setAttribute('y', by);
        selectionBoxRect.setAttribute('width', bw);
        selectionBoxRect.setAttribute('height', bh);

        // 修正：原本用 querySelectorAll('.custom-element') 會連「組合群組內部的
        // 子物件」也一起抓出來，跟外層的組合群組同時各自獨立加進 selectedEls。
        // 結果拖曳移動時，群組本身用 data-tx/data-ty 整體平移一次，框選有碰到
        // 的那個子物件又被「當成獨立物件」再直接改一次自己的 data-state 座標，
        // 等於被移動了兩次、跟其他沒被碰到的兄弟子物件位置對不齊、越拖越偏。
        // 這裡改成只抓 customLayer 的「直接子元素」(:scope > .custom-element)，
        // 也就是畫布上最外層的物件（單一形狀，或整個組合群組），不會再誤選到組合
        // 內部的子物件；組合是否被框選命中，仍由 shapeIntersectsBox() 遞迴檢查
        // 其內部子物件是否有任何一個落在選取框內來判斷。
        const allElements = customLayer.querySelectorAll(':scope > .custom-element');
        allElements.forEach(el => {
          try {
            let isIntersecting = shapeIntersectsBox(el, bx, by, bw, bh);
            if (isIntersecting) {
              el.classList.add('selected-el');
              selectedEls.add(el);
            } else if (!evt.shiftKey) {
              el.classList.remove('selected-el');
              selectedEls.delete(el);
            }
          } catch (e) { }
        });

        // 加入對人員物件的框選判斷
        const allPeople = autoLayer.querySelectorAll('.draggable-node');
        allPeople.forEach(el => {
          try {
            let bbox = el.getBBox();
            let isIntersecting = !(bbox.x > bx + bw ||
              bbox.x + bbox.width < bx ||
              bbox.y > by + bh ||
              bbox.y + bbox.height < by);
            let pId = el.getAttribute('data-person-id');
            if (isIntersecting) {
              el.classList.add('selected-el');
              selectedPeopleIds.add(pId);
            } else if (!evt.shiftKey) {
              el.classList.remove('selected-el');
              selectedPeopleIds.delete(pId);
            }
          } catch (e) { }
        });

        syncToolbarWithSelection();
        syncStylePanel();
        renderControls();
        return;
      }

      if (activeHandleAction && activeHandleTarget) {
        let state = JSON.parse(activeHandleTarget.getAttribute('data-state'));
        let dx = pos.x - handleStartPt.x;
        let dy = pos.y - handleStartPt.y;

        if (activeHandleAction === 'p1') { state.x1 = pos.x; state.y1 = pos.y; }
        else if (activeHandleAction === 'p2') { state.x2 = pos.x; state.y2 = pos.y; }
        else if (activeHandleAction === 'tl') { state.x = pos.x; state.y = pos.y; state.w -= dx; state.h -= dy; }
        else if (activeHandleAction === 'tr') { state.y = pos.y; state.w = pos.x - state.x; state.h -= dy; }
        else if (activeHandleAction === 'bl') { state.x = pos.x; state.w -= dx; state.h = pos.y - state.y; }
        else if (activeHandleAction === 'br') { state.w = pos.x - state.x; state.h = pos.y - state.y; }

        // --- 若為扇形，調整控制點時強制兩半徑維持相等 ---
        let targetType = activeHandleTarget.getAttribute('data-type');
        if (targetType === 'sector') {
          let r = Math.max(Math.abs(state.w), Math.abs(state.h));
          state.w = (state.w < 0 ? -1 : 1) * r;
          state.h = (state.h < 0 ? -1 : 1) * r;
        }
        // --- 若為「以 Shift 畫出的正圓／正方形」（state.lockAspect），調整控制點時強制鎖死長寬比，
        //     之後不論拉哪一個角落的控制點都只會等比例放大縮小，永遠維持正圓／正方形，不會被拉成橢圓／長方形。
        //     並依拖曳的角落調整 x／y，讓對角（沒被拖曳的那個角）維持固定不動，符合直覺的縮放行為。
        else if ((targetType === 'ellipse' || targetType === 'rect') && state.lockAspect) {
          let s = Math.max(Math.abs(state.w), Math.abs(state.h));
          let newW = (state.w < 0 ? -1 : 1) * s;
          let newH = (state.h < 0 ? -1 : 1) * s;
          if (activeHandleAction === 'tl') { state.x += (state.w - newW); state.y += (state.h - newH); }
          else if (activeHandleAction === 'tr') { state.y += (state.h - newH); }
          else if (activeHandleAction === 'bl') { state.x += (state.w - newW); }
          // 'br'：固定角是左上角（state.x, state.y），不需額外調整
          state.w = newW;
          state.h = newH;
        }
        // -------------------------------------------------------------
        activeHandleTarget.setAttribute('data-state', JSON.stringify(state));
        renderShape(activeHandleTarget);
        renderControls();
        handleStartPt = pos;
        return;
      }

      if (!isDrawing) return;
      let mode = document.getElementById('draw-mode').value;

      if (mode === 'select' && (selectedEls.size > 0 || selectedPeopleIds.size > 0) && startPt) {
        let dx = pos.x - startPt.x; let dy = pos.y - startPt.y;
        
        // 處理被選取人員的拖曳
        if (selectedPeopleIds.size > 0) {
          selectedPeopleIds.forEach(pId => {
            if (!nodeOffsets[pId]) nodeOffsets[pId] = { x: 0, y: 0 };
            nodeOffsets[pId].x += dx; 
            nodeOffsets[pId].y += dy;
          });

          // 畫布自動水平：單一人員拖曳時，若與配偶或同一排兄弟姊妹的高度接近水平，自動吸附到同一水平線
          if (selectedPeopleIds.size === 1) {
            const SNAP_PX = 10;
            const draggedId = Array.from(selectedPeopleIds)[0];
            const { coords: baseCoordsForSnap } = calculateBaseCoordinates();
            const person = people.find(x => x.id === draggedId);
            const myBase = baseCoordsForSnap[draggedId];
            if (person && myBase) {
              let sameRowIds = [];
              if (person.spouse) sameRowIds.push(person.spouse);
              people.forEach(par => {
                if (par.children && par.children.includes(draggedId)) {
                  (par.children || []).forEach(sib => { if (sib !== draggedId) sameRowIds.push(sib); });
                }
              });
              sameRowIds = [...new Set(sameRowIds)];
              const myFinalY = myBase.y + nodeOffsets[draggedId].y;
              for (const otherId of sameRowIds) {
                const otherBase = baseCoordsForSnap[otherId];
                if (!otherBase) continue;
                const otherOffset = nodeOffsets[otherId] || { x: 0, y: 0 };
                const otherFinalY = otherBase.y + otherOffset.y;
                if (Math.abs(myFinalY - otherFinalY) < SNAP_PX) {
                  nodeOffsets[draggedId].y = otherFinalY - myBase.y;
                  break;
                }
              }
            }
          }

          renderGenogram();
        }

        // 處理被選取標註物件的拖曳
        if (selectedEls.size > 0) {
          selectedEls.forEach(el => {
            let type = el.getAttribute('data-type');
            if (type === 'group') {
              let tx = parseFloat(el.getAttribute('data-tx') || 0) + dx; let ty = parseFloat(el.getAttribute('data-ty') || 0) + dy;
              el.setAttribute('data-tx', tx); el.setAttribute('data-ty', ty); applyTransform(el);
            } else {
              let stateStr = el.getAttribute('data-state');
              if (stateStr) {
                let state = JSON.parse(stateStr);
                if (type === 'line' || type === 'arrow-single' || type === 'arrow-double') {
                  state.x1 += dx; state.y1 += dy; state.x2 += dx; state.y2 += dy;
                } else if (type === 'ellipse' || type === 'rect' || type === 'sector' || type === 'text') {
                  state.x += dx; state.y += dy;
                } else if (type === 'cross') {
                  state.cx += dx; state.cy += dy;
                } else if (type === 'freehand' || type === 'cohabit-draw') {
                  state.pts = state.pts.map(p => [p[0] + dx, p[1] + dy]);
                }
                el.setAttribute('data-state', JSON.stringify(state));
                renderShape(el);
              }
            }
          });
          renderControls();
        }
        startPt = pos;
      }
      else if (currentDrawEl) {
        let state = JSON.parse(currentDrawEl.getAttribute('data-state'));
        if (mode === 'freehand' || mode === 'cohabit-draw') {
          state.pts.push([pos.x, pos.y]);
        }
        else if (mode === 'ellipse') {
          let dw = pos.x - state.x;
          let dh = pos.y - state.y;
          // 按住 Shift 畫正圓；放開滑鼠時會依此鎖定該物件之後只能等比例縮放（保持正圓）
          if (evt.shiftKey) {
            let s = Math.max(Math.abs(dw), Math.abs(dh));
            dw = (dw < 0 ? -1 : 1) * s;
            dh = (dh < 0 ? -1 : 1) * s;
          }
          state.w = dw;
          state.h = dh;
          state.lockAspect = !!evt.shiftKey;
        }
        else if (mode === 'rect') {
          let dw = pos.x - state.x;
          let dh = pos.y - state.y;
          // 按住 Shift 畫正方形；放開滑鼠時會依此鎖定該物件之後只能等比例縮放（保持正方形）
          if (evt.shiftKey) {
            let s = Math.max(Math.abs(dw), Math.abs(dh));
            dw = (dw < 0 ? -1 : 1) * s;
            dh = (dh < 0 ? -1 : 1) * s;
          }
          state.w = dw;
          state.h = dh;
          state.lockAspect = !!evt.shiftKey;
        }
        /*else if (mode === 'ellipse') {
          state.w = pos.x - state.x; state.h = pos.y - state.y;
        }
        else if (mode === 'rect') {
          let dw = pos.x - state.x, dh = pos.y - state.y;
          if (evt.shiftKey) {
            let s = Math.max(Math.abs(dw), Math.abs(dh));
            dw = (dw < 0 ? -1 : 1) * s; dh = (dh < 0 ? -1 : 1) * s;
          }
          state.w = dw; state.h = dh;
        }*/
        /*else if (mode === 'sector') {
          // 按住 Shift 可強制兩個方向半徑等長，畫出正圓的 1/4 扇形。
          let dw = pos.x - state.x, dh = pos.y - state.y;
          if (evt.shiftKey) {
            let s = Math.max(Math.abs(dw), Math.abs(dh));
            dw = (dw < 0 ? -1 : 1) * s; dh = (dh < 0 ? -1 : 1) * s;
          }
          state.w = dw; state.h = dh;
        }*/
        else if (mode === 'sector') {
          // 自動將兩邊半徑取較大值 r，維持 1/4 正圓弧度-gemini-
          let dw = pos.x - state.x, dh = pos.y - state.y;
          let r = Math.max(Math.abs(dw), Math.abs(dh));
          state.w = (dw < 0 ? -1 : 1) * r;
          state.h = (dh < 0 ? -1 : 1) * r;
        }
        else if (mode.includes('line') || mode.includes('arrow')) {
          state.x2 = pos.x; state.y2 = pos.y;
        }
        currentDrawEl.setAttribute('data-state', JSON.stringify(state));
        renderShape(currentDrawEl);
      }
    });

    function handlePointerUpLogic(evt) {
      if (!evt.isPrimary) return;
      try { svg.releasePointerCapture(evt.pointerId); } catch (e) { }

      if (evt.button === 2 || isCanvasPanning) {
        isCanvasPanning = false;
        svg.style.cursor = 'default';
        return;
      }

      if (isBoxSelecting) {
        isBoxSelecting = false;
        boxSelectStartPt = null;
        if (selectionBoxRect) selectionBoxRect.style.display = 'none';
        return;
      }

      if (activeHandleAction) { activeHandleAction = null; activeHandleTarget = null; handleStartPt = null; commitHistory(); return; }

      let wasDrawingOrDragging = isDrawing;

      if (isDrawing && currentDrawEl) {
        let mode = document.getElementById('draw-mode').value;
        if (mode === 'cohabit-draw') {
          let state = JSON.parse(currentDrawEl.getAttribute('data-state'));
          state.isFinished = true;
          currentDrawEl.setAttribute('data-state', JSON.stringify(state));
          renderShape(currentDrawEl);
        }
        toggleSelect(currentDrawEl, null); document.getElementById('draw-mode').value = 'select';
      }
      isDrawing = false; currentDrawEl = null; startPt = null;
      // 新增：拖曳人物節點／自訂標註物件，或剛完成一次繪製，結束時記錄一筆歷史紀錄
      if (wasDrawingOrDragging) commitHistory();
    }

    svg.addEventListener('pointerup', handlePointerUpLogic);
    svg.addEventListener('pointercancel', handlePointerUpLogic);

    svg.addEventListener('contextmenu', function (evt) {
      evt.preventDefault();
    });

    window.addEventListener('pointerup', function (evt) {
      if (evt.button === 2 && isCanvasPanning) {
        isCanvasPanning = false;
        svg.style.cursor = 'default';
      }
    });

    svg.addEventListener('wheel', function (evt) {
      evt.preventDefault();
      if (!window.currentViewBox) return;
      let zoomFactor = evt.deltaY > 0 ? 1.1 : 1 / 1.1;
      let pt = getMousePos(evt);

      window.currentViewBox.x = pt.x - (pt.x - window.currentViewBox.x) * zoomFactor;
      window.currentViewBox.y = pt.y - (pt.y - window.currentViewBox.y) * zoomFactor;
      window.currentViewBox.w *= zoomFactor;
      window.currentViewBox.h *= zoomFactor;

      svg.setAttribute("viewBox", `${window.currentViewBox.x} ${window.currentViewBox.y} ${window.currentViewBox.w} ${window.currentViewBox.h}`);
      updateStylePanelZoomScale();
      renderControls();
    }, { passive: false });

    function transformSelected(action, val) {
      if (selectedEls.size === 0 && selectedPeopleIds.size === 0) { customAlert("請先點選畫布上的物件。"); return; }
      if (action === 'delete') {
        selectedEls.forEach(el => el.remove()); selectedEls.clear(); 
        if (selectedPeopleIds.size > 0) {
           let ids = Array.from(selectedPeopleIds);
           ids.forEach(pId => removePerson(pId));
           selectedPeopleIds.clear();
        }
        renderControls();
      }
      commitHistory();
    }

    function groupSelected() {
      if (selectedEls.size < 2) { customAlert("請按住 Shift 點選或拉框選取兩個以上的物件才能群組。"); return; }
      let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.classList.add('custom-element'); g.setAttribute('data-type', 'group');
      g.setAttribute('data-tx', 0); g.setAttribute('data-ty', 0); g.setAttribute('data-rot', 0);
      g.style.cursor = 'grab';

      selectedEls.forEach(el => { g.appendChild(el); });
      customLayer.appendChild(g);
      setTimeout(() => { toggleSelect(g, null); }, 10);
      commitHistory();
    }

    function ungroupSelected() {
      let toUngroup = Array.from(selectedEls).filter(el => el.getAttribute('data-type') === 'group');
      if (toUngroup.length === 0) { customAlert("選取的項目中沒有可以解散的群組。"); return; }

      toUngroup.forEach(group => {
        let children = Array.from(group.childNodes);

        // 解散前先記錄每個子物件「目前」相對於畫布(customLayer)的實際變換矩陣，
        // 避免解散後子物件只保留群組化之前的舊變換，導致畫面跳回原本組合前的位置
        let groupCTM = customLayer.getScreenCTM();
        let childMatrices = children.map(child => {
          try {
            let childCTM = child.getScreenCTM();
            return { child, m: (groupCTM && childCTM) ? groupCTM.inverse().multiply(childCTM) : null };
          } catch (e) { return { child, m: null }; }
        });

        children.forEach(child => customLayer.appendChild(child));
        group.remove();

        childMatrices.forEach(({ child, m }) => {
          if (!m || !child.getBBox) return;
          try {
            let bbox = child.getBBox();
            let cx = bbox.x + bbox.width / 2, cy = bbox.y + bbox.height / 2;
            let px = m.a * cx + m.c * cy + m.e, py = m.b * cx + m.d * cy + m.f;
            let rot = Math.atan2(m.b, m.a) * 180 / Math.PI;
            child.setAttribute('data-tx', px - cx);
            child.setAttribute('data-ty', py - cy);
            child.setAttribute('data-rot', rot);
            applyTransform(child);
          } catch (e) { }
        });
      });
      selectedEls.clear(); renderControls();
      commitHistory();
    }

    function getSvgSourceForExport() {
      toggleSelect(null);
      controlsLayer.innerHTML = '';

      const gridRect = document.getElementById('grid-pattern-rect');
      if (gridRect) gridRect.style.display = 'none';

      // 世代顏色區塊與「第N代」標籤僅供畫布編輯時參考，輸出圖片時一律不顯示
      const genBgLayer = document.getElementById('gen-bg-layer');
      if (genBgLayer) genBgLayer.style.display = 'none';

      const svgElement = document.getElementById('genogram-svg');
      let bbox = svgElement.getBBox();
      const cloneSvg = svgElement.cloneNode(true);

      if (gridRect) gridRect.style.display = 'block';
      if (genBgLayer) genBgLayer.style.display = '';

      const idLabels = cloneSvg.querySelectorAll('.person-id-label');
      idLabels.forEach(label => label.parentNode.removeChild(label));

      const clonedGenBg = cloneSvg.querySelector('#gen-bg-layer');
      if (clonedGenBg) clonedGenBg.parentNode.removeChild(clonedGenBg);

      let pad = 50;
      let bx = bbox.x - pad;
      let by = bbox.y - pad;
      let bw = bbox.width + pad * 2;
      let bh = bbox.height + pad * 2;

      if (bw <= pad * 2 || bh <= pad * 2) { bx = 0; by = 0; bw = 800; bh = 600; }

      cloneSvg.setAttribute('viewBox', `${bx} ${by} ${bw} ${bh}`);
      cloneSvg.setAttribute('width', bw);
      cloneSvg.setAttribute('height', bh);

      const serializer = new XMLSerializer();
      return {
        source: '<?xml version="1.0" encoding="utf-8"?>\n' + serializer.serializeToString(cloneSvg),
        width: bw,
        height: bh
      };
    }

    function getFileName(ext) {
      let name = document.getElementById('filename-input').value.trim() || '家系圖';
      return name + "." + ext;
    }

    function downloadSVG() {
      const exportData = getSvgSourceForExport();
      const blob = new Blob([exportData.source], { type: "image/svg+xml;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = getFileName("svg");
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function getSvgAsBase64() {
      return new Promise((resolve) => {
        const exportData = getSvgSourceForExport();
        const blob = new Blob([exportData.source], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const scale = 6.25;
          canvas.width = exportData.width * scale;
          canvas.height = exportData.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/png"));
        };
        img.src = url;
      });
    }

    async function downloadPNG() {
      const dataUrl = await getSvgAsBase64();
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = getFileName("png");
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function exportJSON() {
      toggleSelect(null); controlsLayer.innerHTML = '';
      const payload = { people: people, cohabitGroups: cohabitGroups, nodeOffsets: nodeOffsets, marriageLineStyles: marriageLineStyles, manualLinks: manualLinks, customLayerHTML: customLayer.innerHTML, customObjectLibrary: customObjectLibrary };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload));
      const a = document.createElement('a');
      a.href = dataStr; a.download = getFileName("json");
      document.body.appendChild(a); a.click(); a.remove();
    }

    function importJSON(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = JSON.parse(e.target.result);
          people = data.people || []; cohabitGroups = data.cohabitGroups || []; nodeOffsets = data.nodeOffsets || {}; marriageLineStyles = data.marriageLineStyles || {}; manualLinks = data.manualLinks || [];
          window.currentViewBox = null;
          if (data.customLayerHTML !== undefined) {
            setSVGHtmlSafe(customLayer, data.customLayerHTML);
            customLayer.querySelectorAll('.custom-element').forEach(el => {
              if (el.getAttribute('data-state')) renderShape(el);
            });
          }
          // 匯入主檔案時，一併合併匯入該檔案內附帶的自繪物件儲存庫
          if (Array.isArray(data.customObjectLibrary)) { mergeCustomObjectLibrary(data.customObjectLibrary); }
          renderForms(); customAlert("設定已成功匯入！(畫布所有物件皆可再次拖拉控制點編輯)");
        } catch (err) { customAlert("檔案解析失敗，請確認是否為正確的 JSON 檔案！"); }
        event.target.value = "";
      };
      reader.readAsText(file);
    }

    // Esc 鍵可快速取消目前啟用中的樣式套用模式；
    // 新增：Ctrl+Z／Ctrl+Y（或 Ctrl+Shift+Z）上一步／下一步、Delete/Backspace 刪除選取的畫布物件、
    // Ctrl+C／Ctrl+V 複製／貼上選取的畫布物件（若為組合物件會整組一併複製貼上）。
    // 當焦點在輸入框／文字區塊（例如左側人員資料表單、彈出視窗的文字輸入）時，一律不攔截，
    // 避免影響一般文字編輯時的複製/貼上/刪除/復原操作。
    function isTypingContext(evt) {
      let el = evt.target;
      if (!el) return false;
      let tag = el.tagName ? el.tagName.toUpperCase() : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (el.isContentEditable) return true;
      return false;
    }

    window.addEventListener('keydown', function (evt) {
      if (evt.key === 'Escape' && manualLinkSourceId) {
        manualLinkSourceId = null;
        svg.classList.remove('link-picking-cursor');
        document.body.classList.remove('link-picking-lock');
        syncStylePanel();
        return;
      }
      // 「連結其他人」狀態鎖定中：除了上面的 Escape 取消，其餘所有鍵盤快捷鍵一律不執行
      // （例如 Ctrl+Z／刪除／方向鍵移動等），需先完成連結或取消才能繼續操作
      if (manualLinkSourceId) return;

      if (evt.key === 'Escape' && activeStyleMode) {
        activateStyleMode(activeStyleMode); // 傳入相同值會被 toggle 成 null
        return;
      }

      if (isTypingContext(evt)) return;

      let mod = evt.ctrlKey || evt.metaKey;

      if (mod && !evt.shiftKey && (evt.key === 'z' || evt.key === 'Z')) {
        evt.preventDefault();
        undoHistory();
        return;
      }
      if (mod && ((evt.key === 'y' || evt.key === 'Y') || (evt.shiftKey && (evt.key === 'z' || evt.key === 'Z')))) {
        evt.preventDefault();
        redoHistory();
        return;
      }
      if (mod && (evt.key === 'c' || evt.key === 'C')) {
        if (selectedEls.size > 0) {
          evt.preventDefault();
          copySelectedElements();
        }
        return;
      }
      if (mod && (evt.key === 'v' || evt.key === 'V')) {
        if (clipboardData && clipboardData.length > 0) {
          evt.preventDefault();
          pasteClipboard();
        }
        return;
      }
      if (evt.key === 'Delete' || evt.key === 'Backspace') {
        // 新增：若目前選取的是「手動建立的自訂關係線」，Delete／Backspace 直接刪除該連結
        if (selectedMarriageKey && selectedMarriageKey.indexOf('manual__') === 0) {
          evt.preventDefault();
          deleteManualLink(selectedMarriageKey.slice('manual__'.length));
          return;
        }
        if (selectedEls.size > 0 || selectedPeopleIds.size > 0) {
          evt.preventDefault();
          transformSelected('delete');
        }
        return;
      }
      // ========= 新增以下這段：方向鍵微調移動 ======gemini===
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(evt.key)) {
        if (selectedEls.size > 0 || selectedPeopleIds.size > 0) {
          evt.preventDefault(); // 防止按上下鍵時網頁跟著捲動

          // 預設每次按鍵移動 1px；若同時按住 Shift 鍵，則一次快移 10px 
          let moveAmount = evt.shiftKey ? 10 : 1;
          let dx = 0, dy = 0;
          if (evt.key === 'ArrowUp') dy = -moveAmount;
          if (evt.key === 'ArrowDown') dy = moveAmount;
          if (evt.key === 'ArrowLeft') dx = -moveAmount;
          if (evt.key === 'ArrowRight') dx = moveAmount;

          let hasMoved = false;

          // 1. 處理被選取「人員節點」的移動
          if (selectedPeopleIds.size > 0) {
            selectedPeopleIds.forEach(pId => {
              if (!nodeOffsets[pId]) nodeOffsets[pId] = { x: 0, y: 0 };
              nodeOffsets[pId].x += dx;
              nodeOffsets[pId].y += dy;
              hasMoved = true;
            });
            if (hasMoved) renderGenogram();
          }

          // 2. 處理被選取「自訂幾何物件（標註、線條等）」的移動
          if (selectedEls.size > 0) {
            selectedEls.forEach(el => {
              let type = el.getAttribute('data-type');
              if (type === 'group') { // 處理組合圖形（例如從暫存庫匯入的圖形）
                let tx = parseFloat(el.getAttribute('data-tx') || 0) + dx;
                let ty = parseFloat(el.getAttribute('data-ty') || 0) + dy;
                el.setAttribute('data-tx', tx);
                el.setAttribute('data-ty', ty);
                applyTransform(el);
                hasMoved = true;
              } else {
                let stateStr = el.getAttribute('data-state');
                if (stateStr) {
                  let state = JSON.parse(stateStr);
                  if (type === 'line' || type === 'arrow-single' || type === 'arrow-double') {
                    state.x1 += dx; state.y1 += dy; state.x2 += dx; state.y2 += dy;
                  } else if (type === 'ellipse' || type === 'rect' || type === 'sector' || type === 'text') {
                    state.x += dx; state.y += dy;
                  } else if (type === 'cross') {
                    state.cx += dx; state.cy += dy;
                  } else if (type === 'freehand' || type === 'cohabit-draw') {
                    state.pts = state.pts.map(p => [p[0] + dx, p[1] + dy]);
                  }
                  el.setAttribute('data-state', JSON.stringify(state));
                  renderShape(el);
                  hasMoved = true;
                }
              }
            });
            if (hasMoved) renderControls();
          }

          // 3. 儲存至上一步/下一步的歷史紀錄中
          // 這裡使用 setTimeout 延遲儲存（Debounce 防抖機制）
          // 避免長按方向鍵不放時，產生幾十筆零碎歷史紀錄，導致 Ctrl+Z 退不回原本狀態
          if (hasMoved) {
            clearTimeout(window.moveHistoryTimeout);
            window.moveHistoryTimeout = setTimeout(() => {
              commitHistory();
            }, 400);
          }
        }
        return;
      }
      // ===============================================
    });

    renderForms();
    syncStylePanel();
    loadCustomObjectLibraryFromStorage();
    renderCustomObjectLibrary();
  </script>
</body>

</html>
