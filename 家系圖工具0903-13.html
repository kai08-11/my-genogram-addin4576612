    // 配偶下拉選單用：找出某人所有「血親」（沿親子關係鏈往上/往下延伸，不經過配偶關係），
    // 涵蓋父母、子女、兄弟姊妹、（外）祖父母、孫子女、叔伯姑舅姨、堂表兄弟姊妹、雙胞胎等，
    // 讓配偶選單中不會列出自己的血親。
    function getBloodRelativeIds(pid) {
      let visited = new Set([pid]);
      let queue = [pid];
      while (queue.length) {
        let cur = queue.shift();
        let curObj = people.find(x => x.id === cur);
        if (curObj && curObj.children) {
          curObj.children.forEach(cid => { if (!visited.has(cid)) { visited.add(cid); queue.push(cid); } });
        }
        if (curObj && curObj.twinSiblings) {
          curObj.twinSiblings.forEach(tid => { if (!visited.has(tid)) { visited.add(tid); queue.push(tid); } });
        }
        people.forEach(par => {
          if (par.children && par.children.includes(cur)) {
            if (!visited.has(par.id)) { visited.add(par.id); queue.push(par.id); }
            // 子女資料只會記錄在配偶其中一方身上，另一方（同為孩子的父/母）也需一併視為血親，
            // 否則會漏掉「配偶」欄位仍會列出自己父母其中一人的錯誤（除錯項目）。
            if (par.spouse && !visited.has(par.spouse)) { visited.add(par.spouse); queue.push(par.spouse); }
          }
        });
      }
      visited.delete(pid);
      return visited;
    }

    // 雙胞胎連結用：找出某人的「手足」（與其共用至少一位父/母的其他子女，不含自己）
    function getSiblingIds(pid) {
      let result = new Set();
      people.forEach(par => {
        if (par.children && par.children.includes(pid)) {
          par.children.forEach(cid => { if (cid !== pid) result.add(cid); });
        }
      });
      return result;
    }

    function renderForms() {
      const container = document.getElementById('people-container');
      container.innerHTML = '';

      // 依「獨立家族＋世代深度」分組（與畫布上的顏色區塊使用同一套配色，方便對照；
      // 由上方按鈕新增的每個人都自成一個獨立家族，不會與其他家族混在同一組）
      let { genLevels, familyOf } = calculateBaseCoordinates();
      let genMap = {};
      people.forEach((p, index) => {
        let gn = (genLevels && genLevels[p.id] !== undefined) ? genLevels[p.id] : 0;
        let fam = (familyOf && familyOf[p.id] !== undefined) ? familyOf[p.id] : 0;
        let key = fam + '_' + gn;
        if (!genMap[key]) genMap[key] = { fam, gn, items: [] };
        genMap[key].items.push({ p, index });
      });

      Object.keys(genMap).sort((a, b) => (genMap[a].fam - genMap[b].fam) || (genMap[a].gn - genMap[b].gn)).forEach(key => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'gen-group';
        const { fam, gn, items } = genMap[key];
        const color = getFamilyGenColor(fam, gn);
        groupDiv.style.borderLeftColor = color;
        groupDiv.style.background = hexToRgba(color, 0.05);

        items.forEach(({ p, index }) => {
          const row = document.createElement('div'); row.className = 'person-row';
          row.id = 'person-row-' + p.id;

          let twinOptsHTML = '';
          if (p.hasTwin) {
            let siblingIds = getSiblingIds(p.id);
            twinOptsHTML = people.filter(x => siblingIds.has(x.id)).map(x => {
              let linked = p.twinSiblings && p.twinSiblings.includes(x.id);
              return `<button type="button" class="toggle-btn tg-twin-link ${linked ? 'active' : ''}" onclick="toggleTwin('${p.id}', '${x.id}')" title="連結雙胞胎：${x.id}">${x.id}</button>`;
            }).join('');
          }

          // 快速產生子女序列（與配偶共用同一批子女，輸入 男/女、M/F 或 1/2 即可依序建立/更新）
          let spouseObjForQuick = people.find(s => s.id === p.spouse);
          let combinedChildren = [];
          {
            let seen = new Set();
            (p.children || []).forEach(id => { if (!seen.has(id)) { combinedChildren.push(id); seen.add(id); } });
            if (spouseObjForQuick && spouseObjForQuick.children) spouseObjForQuick.children.forEach(id => { if (!seen.has(id)) { combinedChildren.push(id); seen.add(id); } });
            combinedChildren.sort((a, b) => people.findIndex(x => x.id === a) - people.findIndex(x => x.id === b));
          }
          let quickSeqValue = combinedChildren.join('');

          const genderLabel = p.gender === 'M' ? '男' : (p.gender === 'F' ? '女' : '未知');

          row.innerHTML = `
            <div class="pc-grid">
              <div class="pc-field">
                <label>編號</label>
                <div class="pc-id-badge">${p.id}</div>
              </div>
              <div class="pc-field">
                <label>案主</label>
                <button class="toggle-btn tg-client ${p.isClient ? 'active' : ''}" onclick="updatePerson('${p.id}', 'isClient', ${!p.isClient})" title="案主">★ 案主</button>
              </div>

              <div class="pc-field">
                <label>性別</label>
                <button class="gender-btn gender-${p.gender}" onclick="cycleGender('${p.id}')">${genderLabel}</button>
              </div>
              <div class="pc-field">
                <label>年齡</label>
                <input type="number" value="${p.age}" onchange="updatePerson('${p.id}', 'age', this.value)" placeholder="無">
              </div>

              <div class="pc-field">
                <label>身心障礙</label>
                <button class="toggle-btn tg-disability ${p.disability ? 'active' : ''}" onclick="updatePerson('${p.id}', 'disability', ${!p.disability})" title="身心障礙">♿ 身障</button>
              </div>
              <div class="pc-field">
                <label>狀態</label>
                <button class="toggle-btn tg-status ${p.status ? 'active' : ''}" onclick="updatePerson('${p.id}', 'status', ${!p.status})" title="存 / 歿">${p.status ? '✝ 歿' : '● 存'}</button>
              </div>

              <div class="pc-field">
                <label>配偶</label>
                <button class="toggle-btn tg-spouse ${p.hasSpouse ? 'active' : ''} ${p.hasSpouse && p.divorced ? 'divorced' : ''}" onclick="togglePersonSpouse('${p.id}')" title="尚無配偶時點擊會自動新增一位異性配偶；已有配偶時點擊在「已婚」與「離婚」間切換（同一人）。如需完全解除／更換配偶，請用下方選單選擇「無配偶」">${p.hasSpouse && p.divorced ? '💔 離婚' : '💍 配偶'}</button>
                ${p.hasSpouse ? `<div class="spouse-combo">
                  <input type="text" id="spouse-input-${p.id}" class="pc-sub-select spouse-search-input" autocomplete="off"
                    value="${p.spouse || ''}" placeholder="搜尋編號選擇配偶，留空＝無配偶"
                    oninput="handleSpouseSearchInput('${p.id}', this.value)"
                    onfocus="openSpouseDropdown('${p.id}')"
                    onblur="handleSpouseInputBlur('${p.id}')"
                    onkeydown="handleSpouseInputKeydown(event, '${p.id}')">
                  <div class="spouse-dropdown-list" id="spouse-dropdown-${p.id}"></div>
                </div>` : ''}
              </div>
              <div class="pc-field">
                <label>雙胞胎</label>
                <button class="toggle-btn tg-twin ${p.hasTwin ? 'active' : ''}" onclick="updatePerson('${p.id}', 'hasTwin', ${!p.hasTwin})" title="雙胞胎">👥 雙胞胎</button>
                ${p.hasTwin ? `<div class="pc-twin-box">${twinOptsHTML || '此人無手足可連結'}</div>` : ''}
              </div>

              <div class="pc-field pc-field-full">
                <label>⚡ 快速產生子女</label>
                <div class="quick-child-row" style="margin-top:0;">
                  <input type="text" value="${quickSeqValue}" placeholder="例：女男12 或 CD" onchange="quickSetChildren('${p.id}', this.value)">
                  <span class="hint-small">輸入「男/女」或「1/2」依序新增子女；輸入英文字母(不分大小寫)則連結畫布上已存在的該編號人員（與配偶共用同一批子女）。</span>
                </div>
              </div>
            </div>
            <div class="pc-footer">
              <button class="btn-danger" onclick="removePerson('${p.id}')">刪除</button>
            </div>
          `;
          groupDiv.appendChild(row);
        });

        container.appendChild(groupDiv);
      });

      renderCohabitForms(); renderGenogram();
    }

    // 畫布點擊人物時，左側面板自動捲動至該人物的設定列並短暫高亮，方便快速定位編輯
    function scrollToPersonRow(pId) {
      const row = document.getElementById('person-row-' + pId);
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('row-flash');
      setTimeout(() => row.classList.remove('row-flash'), 1200);
    }

    // 點擊配偶按鈕：
    // 尚無配偶（p.spouse 為空）時，自動新增一位異性配偶（男左女右由畫布排版自動處理，使用者仍可自行更換性別）；
    // 已有配偶時（不論目前是已婚或離婚），在「已婚」↔「離婚」之間切換，並固定指向同一位配偶（不會另外新增新的人）；
    // 離婚時畫布上兩人連線會打叉叉。若要完全解除配偶關係（換人／取消），請使用配偶下方的下拉選單選擇「無配偶」。
    function togglePersonSpouse(id) {
      const p = people.find(x => x.id === id);
      if (!p) return;
      if (!p.spouse) {
        // 從未有過配偶 → 自動新增一位異性配偶（已婚）
        let newGender = p.gender === 'M' ? 'F' : (p.gender === 'F' ? 'M' : 'F');
        let newId = getNextID();
        people.push({ id: newId, gender: newGender, age: '', disability: false, status: false, isClient: false, hasSpouse: true, spouse: id, hasChildren: false, children: [], hasTwin: false, twinSiblings: [], divorced: false });
        p.hasSpouse = true; p.spouse = newId; p.divorced = false;
      } else {
        // 已有配偶（同一人）→ 在「已婚」與「離婚」之間切換
        const sp = people.find(x => x.id === p.spouse);
        p.divorced = !p.divorced; p.hasSpouse = true;
        if (sp) { sp.divorced = p.divorced; sp.hasSpouse = true; }
      }
      renderForms();
    }

    // 依序列字串快速建立／連結一對夫妻（或單親）的子女：
    // 輸入「男/女」或「1/2」→ 依序新增一位新的子女；輸入英文字母(不分大小寫) → 連結畫布上已存在、該編號的人員成為子女
    function quickSetChildren(parentId, seqStr) {
      const p = people.find(x => x.id === parentId);
      if (!p) return;
      const spouse = p.spouse ? people.find(x => x.id === p.spouse) : null;

      // 目前這對夫妻共同的子女，依原本顯示順序（序列變短、或子女被改為連結其他人時，用來判斷可否移除舊子女）
      let existing = [];
      {
        let seen = new Set();
        (p.children || []).forEach(id => { if (!seen.has(id)) { existing.push(id); seen.add(id); } });
        if (spouse && spouse.children) spouse.children.forEach(id => { if (!seen.has(id)) { existing.push(id); seen.add(id); } });
        existing.sort((a, b) => people.findIndex(x => x.id === a) - people.findIndex(x => x.id === b));
      }

      // 解析輸入序列：男/1 或 女/2 → 新增一位新子女；英文字母(不分大小寫) → 連結該編號的既有人員；其餘字元忽略
      let tokens = [];
      let linkedIds = new Set();
      for (const ch of (seqStr || '')) {
        if (ch === '男' || ch === '1') tokens.push({ type: 'new', gender: 'M' });
        else if (ch === '女' || ch === '2') tokens.push({ type: 'new', gender: 'F' });
        else if (/[a-zA-Z]/.test(ch)) {
          let targetId = ch.toUpperCase();
          if (targetId === p.id || (spouse && targetId === spouse.id) || linkedIds.has(targetId)) continue; // 不能連結自己、配偶，或重複連結同一人
          let target = people.find(x => x.id === targetId);
          if (target) { tokens.push({ type: 'link', id: targetId }); linkedIds.add(targetId); }
          // 找不到對應編號的人員，忽略該字元
        }
        // 其餘字元忽略
      }

      let reusePtr = 0; // 依序重複利用既有「新建立」的子女(非連結)物件，避免每次輸入都整批刪除重建
      let newChildIds = []; let keepIds = new Set();
      tokens.forEach(tok => {
        if (tok.type === 'link') {
          newChildIds.push(tok.id); keepIds.add(tok.id);
        } else {
          let reuseId = null;
          while (reusePtr < existing.length) {
            let candidate = existing[reusePtr]; reusePtr++;
            if (linkedIds.has(candidate)) continue; // 該既有子女已被明確連結給其他序列位置，不能拿來重複利用
            reuseId = candidate; break;
          }
          if (reuseId) {
            let child = people.find(x => x.id === reuseId);
            if (child) child.gender = tok.gender;
            newChildIds.push(reuseId); keepIds.add(reuseId);
          } else {
            let newId = getNextID();
            people.push({ id: newId, gender: tok.gender, age: '', disability: false, status: false, isClient: false, hasSpouse: false, spouse: '', hasChildren: false, children: [], hasTwin: false, twinSiblings: [], divorced: false });
            newChildIds.push(newId); keepIds.add(newId);
          }
        }
      });

      // 序列變短、或原本的子女沒有再被用到時，移除沒有自己配偶／子女的舊子女；已有後代者則保留，不強制刪除
      existing.forEach(cid => {
        if (keepIds.has(cid)) return;
        let cObj = people.find(x => x.id === cid);
        if (cObj && !cObj.spouse && (!cObj.children || cObj.children.length === 0)) {
          people = people.filter(x => x.id !== cid);
        } else {
          newChildIds.push(cid); keepIds.add(cid);
        }
      });

      // 被連結的既有人員，若原本是別人的子女，先從原父母的子女清單移除，避免同一人同時屬於兩對父母
      linkedIds.forEach(lid => {
        people.forEach(other => { if (other.id !== p.id && other.children) other.children = other.children.filter(id => id !== lid); });
      });

      p.children = newChildIds;
      p.hasChildren = newChildIds.length > 0;
      if (spouse) { spouse.children = []; spouse.hasChildren = false; }

      renderForms();
    }

    function updatePerson(id, field, val) {
      const p = people.find(x => x.id === id);
      if (p) {
        p[field] = val;
        if (field === 'hasSpouse' && !val) {
          if (p.spouse) { let sp = people.find(x => x.id === p.spouse); if (sp && sp.spouse === p.id) sp.spouse = ''; }
          p.spouse = '';
        }
        if (field === 'spouse' && val) {
          const spouseObj = people.find(x => x.id === val);
          if (spouseObj) { spouseObj.spouse = id; spouseObj.hasSpouse = true; }
        }
        if (field === 'hasChildren' && !val) p.children = [];
        if (field === 'hasTwin' && !val) p.twinSiblings = [];
      }
      renderForms();
    }

    function toggleTwin(id1, id2) {
      const p1 = people.find(x => x.id === id1); const p2 = people.find(x => x.id === id2);
      if (!p1 || !p2) return;
      if (!p1.twinSiblings) p1.twinSiblings = []; if (!p2.twinSiblings) p2.twinSiblings = [];
      if (p1.twinSiblings.includes(id2)) {
        p1.twinSiblings = p1.twinSiblings.filter(x => x !== id2);
        p2.twinSiblings = p2.twinSiblings.filter(x => x !== id1);
      } else {
        // 點選手足連結時，讓對方也自動開啟「雙胞胎」屬性，並互相連結
        p1.hasTwin = true; p2.hasTwin = true;
        p1.twinSiblings.push(id2); p2.twinSiblings.push(id1);
      }
      renderForms();
    }

    function renderCohabitForms() {
      const container = document.getElementById('cohabit-container'); container.innerHTML = '';
      cohabitGroups.forEach((group, gIdx) => {
        const div = document.createElement('div'); div.style.cssText = 'display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; background:#fafbfc; padding:10px; border:1px solid #e1e8ed; border-radius:6px;';
        let personButtons = people.map(p => `<button type="button" class="toggle-btn tg-cohabit ${group.includes(p.id) ? 'active' : ''}" onclick="toggleCohabitMember(${gIdx}, '${p.id}')">${p.id}</button>`).join('');
        div.innerHTML = `<strong style="font-size:14px; color:#2c3e50;">同住圈 ${gIdx + 1}：</strong><div style="flex-grow:1; display:flex; flex-wrap:wrap; gap:6px;">${personButtons}</div><button class="btn-danger" style="margin-top:0;" onclick="removeCohabitGroup(${gIdx})">刪除</button>`;
        container.appendChild(div);
      });
      commitHistory();
    }

    function addPerson() { people.push({ id: getNextID(), gender: 'M', age: '', disability: false, status: false, isClient: false, hasSpouse: false, spouse: '', hasChildren: false, children: [], hasTwin: false, twinSiblings: [], divorced: false }); renderForms(); }
    function removePerson(id) { people = people.filter(p => p.id !== id); people.forEach(p => { if (p.spouse === id) { p.spouse = ''; p.hasSpouse = false; } if (p.children) p.children = p.children.filter(c => c !== id); if (p.twinSiblings) p.twinSiblings = p.twinSiblings.filter(c => c !== id); }); cohabitGroups = cohabitGroups.map(g => g.filter(x => x !== id)); delete nodeOffsets[id]; manualLinks = manualLinks.filter(l => l.from !== id && l.to !== id); renderForms(); }

    // 性別按鈕：點擊依 男 → 女 → 未知 循環切換
    function cycleGender(id) {
      const p = people.find(x => x.id === id);
      if (!p) return;
      const order = ['M', 'F', 'U'];
      const idx = order.indexOf(p.gender);
      p.gender = order[(idx + 1) % order.length];
      renderForms();
    }

    // ===== 配偶搜尋下拉選單（完全自訂元件）=====
    // 候選清單：完全排除自己、血親、以及「已有其他配偶」的人，這些人不會出現在清單中，也無法透過輸入編號選取。
    function getSpouseCandidateList(personId) {
      let p = people.find(x => x.id === personId);
      if (!p) return [];
      let bloodRelativeIds = getBloodRelativeIds(personId);
      return people.filter(x => {
        if (x.id === personId) return false;
        if (bloodRelativeIds.has(x.id)) return false;
        if (x.hasSpouse && x.spouse && x.spouse !== personId) return false; // 已有其他配偶，不列入、不可選
        return true;
      });
    }

    function renderSpouseDropdownList(personId, searchText) {
      const listEl = document.getElementById('spouse-dropdown-' + personId);
      if (!listEl) return;
      let candidates = getSpouseCandidateList(personId);
      let q = (searchText || '').trim().toUpperCase();
      if (q) candidates = candidates.filter(x => x.id.toUpperCase().includes(q));
      let html = `<div class="spouse-option spouse-option-clear" onmousedown="event.preventDefault(); pickSpouseCandidate('${personId}', '')">✕ 清除配偶（無配偶）</div>`;
      if (candidates.length === 0) {
        html += `<div class="spouse-option-empty">查無符合的人物（血親／已有其他配偶者不會列出）</div>`;
      } else {
        html += candidates.map(x => `<div class="spouse-option" onmousedown="event.preventDefault(); pickSpouseCandidate('${personId}', '${x.id}')">${x.id}</div>`).join('');
      }
      listEl.innerHTML = html;
    }

    function openSpouseDropdown(personId) {
      // 開啟下拉選單時一律顯示「完整候選清單」，不套用輸入框目前內容做篩選；
      // 即使目前已指定配偶（輸入框已顯示該配偶編號），使用者仍可立即看到畫布上所有其他可選對象。
      // 篩選只在使用者「實際輸入新的搜尋文字」時才會套用（見 handleSpouseSearchInput）。
      renderSpouseDropdownList(personId, '');
      const listEl = document.getElementById('spouse-dropdown-' + personId);
      if (listEl) listEl.classList.add('open');
      const input = document.getElementById('spouse-input-' + personId);
      if (input) input.select(); // 同時全選輸入框內文字，方便使用者直接打字覆蓋既有配偶編號
    }

    function handleSpouseSearchInput(personId, value) {
      renderSpouseDropdownList(personId, value);
      const listEl = document.getElementById('spouse-dropdown-' + personId);
      if (listEl) listEl.classList.add('open');
    }

    function closeSpouseDropdown(personId, revertValue) {
      const listEl = document.getElementById('spouse-dropdown-' + personId);
      if (listEl) listEl.classList.remove('open');
      if (revertValue) {
        const input = document.getElementById('spouse-input-' + personId);
        const p = people.find(x => x.id === personId);
        if (input && p) input.value = p.spouse || '';
      }
    }

    function handleSpouseInputBlur(personId) {
      // 稍微延遲關閉：選項已用 mousedown + preventDefault 避免搶在點擊前失焦，這裡留一點緩衝以防萬一
      setTimeout(() => { closeSpouseDropdown(personId, true); }, 120);
    }

    function pickSpouseCandidate(personId, candidateId) {
      closeSpouseDropdown(personId, false);
      const input = document.getElementById('spouse-input-' + personId);
      if (input) input.value = candidateId;
      changeSpouse(personId, candidateId); // changeSpouse 內部會呼叫 renderForms() 重新渲染整份表單
    }

    function handleSpouseInputKeydown(evt, personId) {
      if (evt.key === 'Escape') {
        closeSpouseDropdown(personId, true);
        evt.target.blur();
        return;
      }
      if (evt.key === 'Enter') {
        evt.preventDefault();
        let typed = (evt.target.value || '').trim().toUpperCase();
        if (!typed) { pickSpouseCandidate(personId, ''); return; }
        let candidates = getSpouseCandidateList(personId);
        let matched = candidates.find(x => x.id.toUpperCase() === typed);
        if (matched) {
          pickSpouseCandidate(personId, matched.id);
        } else {
          customAlert('查無此編號，或該對象為血親／已有其他配偶，無法設為配偶。');
        }
      }
    }

    // 配偶下拉選單改選為既有的人：解除原本配偶的關係，並連結到新選擇的對象；
    // 原本那位配偶（即使因此變成沒有任何關聯的空白人物）一律「保留在畫布上」，不會自動刪除，
    // 使用者如果要移除，需自行「清除配偶」後再用刪除按鈕手動刪除該人。
    function changeSpouse(id, newSpouseId) {
      const p = people.find(x => x.id === id);
      if (!p) return;

      // 支援直接手動輸入編號（不分英文大小寫）來設定配偶，統一轉為大寫後比對既有人員編號
      newSpouseId = (newSpouseId || '').trim();
      if (newSpouseId) {
        newSpouseId = newSpouseId.toUpperCase();
        if (newSpouseId === id.toUpperCase()) { customAlert('不能將自己設為配偶。'); renderForms(); return; }
        const matched = people.find(x => x.id.toUpperCase() === newSpouseId);
        if (!matched) { customAlert('找不到編號為「' + newSpouseId + '」的人物。'); renderForms(); return; }
        newSpouseId = matched.id; // 統一改用畫布上實際的編號大小寫
      }

      const oldSpouseId = p.spouse;
      if (newSpouseId === oldSpouseId) return;

      if (oldSpouseId) {
        const oldSp = people.find(x => x.id === oldSpouseId);
        if (oldSp && oldSp.spouse === id) { oldSp.spouse = ''; oldSp.hasSpouse = false; oldSp.divorced = false; }
      }

      if (newSpouseId) {
        const newSp = people.find(x => x.id === newSpouseId);
        if (newSp) {
          if (newSp.spouse && newSp.spouse !== id) {
            const prevPartner = people.find(x => x.id === newSp.spouse);
            if (prevPartner && prevPartner.spouse === newSp.id) { prevPartner.spouse = ''; prevPartner.hasSpouse = false; prevPartner.divorced = false; }
          }
          newSp.spouse = id; newSp.hasSpouse = true; newSp.divorced = false;
        }
        p.spouse = newSpouseId; p.hasSpouse = true; p.divorced = false;
      } else {
        p.spouse = ''; p.hasSpouse = false; p.divorced = false;
      }

      // 原本的配偶（oldSpouseId）不論是否還有其他關聯，一律保留在畫布上，不自動刪除；
      // 若使用者確實要移除該空白人物，請先將其「清除配偶」，再手動點擊刪除按鈕。
      renderForms();
    }

    function addCohabitGroup() { cohabitGroups.push([]); renderCohabitForms(); }
    function removeCohabitGroup(gIdx) { cohabitGroups.splice(gIdx, 1); renderCohabitForms(); renderGenogram(); }
    function toggleCohabitMember(gIdx, personId) { if (cohabitGroups[gIdx].includes(personId)) { cohabitGroups[gIdx] = cohabitGroups[gIdx].filter(x => x !== personId); } else { cohabitGroups[gIdx].push(personId); } renderCohabitForms(); renderGenogram(); }

    function clearAllPeople() {
      customConfirm("確定清除所有人與畫布所有內容？", function (res) {
        if (res) {
          people = []; cohabitGroups = []; nodeOffsets = {}; marriageLineStyles = {}; manualLinks = [];
          selectedPeopleIds.clear();
          window.currentViewBox = null;
          while (customLayer.firstChild) customLayer.removeChild(customLayer.firstChild);
          renderForms();
        }
      });
    }

    function deleteAllCustomObjects() {
      customConfirm("確認刪除所有自訂標註？", function (res) {
        if (res) {
          while (customLayer.firstChild) customLayer.removeChild(customLayer.firstChild);
          selectedEls.clear(); renderControls();
          commitHistory();
        }
      });
    }

    function getConvexHull(points) {
      if (points.length <= 2) return points; points.sort((a, b) => a.x !== b.x ? a.x - b.x : a.y - b.y);
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const lower = []; for (let i = 0; i < points.length; i++) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], points[i]) <= 0) lower.pop(); lower.push(points[i]); }
      const upper = []; for (let i = points.length - 1; i >= 0; i--) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], points[i]) <= 0) upper.pop(); upper.push(points[i]); }
      upper.pop(); lower.pop(); return lower.concat(upper);
    }

    function calculateBaseCoordinates() {
      let coords = {}; let drawn = new Set(); let isChild = {}; let genLevels = {}; let familyOf = {};
      people.forEach(p => { (p.children || []).forEach(cId => { isChild[cId] = true; }); });
      let topRoots = people.filter(p => !isChild[p.id]);

      // 各獨立家族（頂層根節點）彼此之間的最小間距
      const FAMILY_GAP = 100;
      const widthMemo = {};

      // 取得某對夫妻（或單人）依畫面顯示順序排列好的子女清單（雙胞胎會被排在一起）
      function getOrderedChildren(p1Obj, p2Obj) {
        let childrenSet = new Set(p1Obj ? (p1Obj.children || []) : []);
        if (p2Obj) { (p2Obj.children || []).forEach(cId => childrenSet.add(cId)); }
        let rawChildren = Array.from(childrenSet);
        rawChildren.sort((a, b) => people.findIndex(x => x.id === a) - people.findIndex(x => x.id === b));
        let children = []; let visitedChild = new Set();
        rawChildren.forEach(cId => {
          if (visitedChild.has(cId)) return; let childObj = people.find(x => x.id === cId);
          if (childObj && childObj.hasTwin && childObj.twinSiblings) {
            let siblingsInThisFamily = childObj.twinSiblings.filter(tid => rawChildren.includes(tid));
            siblingsInThisFamily.sort((a, b) => people.findIndex(x => x.id === a) - people.findIndex(x => x.id === b));
            children.push(cId); visitedChild.add(cId);
            siblingsInThisFamily.forEach(tid => { if (!visitedChild.has(tid)) { children.push(tid); visitedChild.add(tid); } });
          } else { children.push(cId); visitedChild.add(cId); }
        });
        return children;
      }

      // 由下往上遞迴計算：某對夫妻（或單人）連同其「所有世代後代」總共需要多寬的水平空間，
      // 這樣不論哪一代人數最多、家庭數最多，上層都能依實際需要的寬度平均分配，而不會互相擠壓重疊
      function computeSubtreeWidth(p1Id, p2Id) {
        let key = p1Id + '::' + (p2Id || '');
        if (widthMemo[key] !== undefined) return widthMemo[key];
        let p1Obj = people.find(x => x.id === p1Id); let p2Obj = p2Id ? people.find(x => x.id === p2Id) : null;
        let ownWidth = p2Obj ? 280 : 180;

        let children = getOrderedChildren(p1Obj, p2Obj);
        if (children.length === 0) { widthMemo[key] = ownWidth; return ownWidth; }

        let childWidths = children.map(cId => {
          let childObj = people.find(x => x.id === cId);
          return childObj && childObj.spouse ? computeSubtreeWidth(cId, childObj.spouse) : computeSubtreeWidth(cId, null);
        });
        let childrenTotal = childWidths.reduce((a, b) => a + b, 0);
        let width = Math.max(ownWidth, childrenTotal);
        widthMemo[key] = width;
        return width;
      }

      // familyIdx：每一組「由上方按鈕新增的獨立世代（頂層根節點，含其配偶與後代）」的專屬編號，
      // 用來讓畫布上的底色區塊依「獨立家族」分組，而不是單純依世代深度分組（避免不相關的家族被誤判為同一代而共用同一底色）
      function layoutCouple(p1Id, p2Id, midX, y, familyIdx, depth) {
        if (drawn.has(p1Id)) return;
        let genNum = depth;
        let p1Obj = people.find(x => x.id === p1Id); let p2Obj = p2Id ? people.find(x => x.id === p2Id) : null;
        let leftId = p1Id, rightId = p2Id;
        if (p2Obj) {
          if (p1Obj.gender === 'F' && p2Obj.gender === 'M') { leftId = p2Id; rightId = p1Id; }
          else if (p1Obj.gender === 'M' && p2Obj.gender === 'F') { leftId = p1Id; rightId = p2Id; }
          coords[leftId] = { x: midX - 70, y: y }; coords[rightId] = { x: midX + 70, y: y };
          drawn.add(leftId); drawn.add(rightId);
          genLevels[leftId] = genNum; genLevels[rightId] = genNum;
          familyOf[leftId] = familyIdx; familyOf[rightId] = familyIdx;
        } else { coords[p1Id] = { x: midX, y: y }; drawn.add(p1Id); genLevels[p1Id] = genNum; familyOf[p1Id] = familyIdx; }

        let children = getOrderedChildren(p1Obj, p2Obj);
        if (children.length === 0) return;

        let childWidths = children.map(cId => {
          let childObj = people.find(x => x.id === cId);
          return childObj && childObj.spouse ? computeSubtreeWidth(cId, childObj.spouse) : computeSubtreeWidth(cId, null);
        });
        let totalW = childWidths.reduce((a, b) => a + b, 0);
        let startX = midX - totalW / 2; let currentX = startX;
        children.forEach((cId, i) => {
          let cx = currentX + childWidths[i] / 2; currentX += childWidths[i];
          let childObj = people.find(x => x.id === cId);
          if (childObj) { if (childObj.spouse && !drawn.has(childObj.spouse)) layoutCouple(cId, childObj.spouse, cx, y + 170, familyIdx, depth + 1); else layoutCouple(cId, null, cx, y + 170, familyIdx, depth + 1); }
        });
      }
      let currentMidX = 600; let familyIdxCounter = 0; let prevRightEdge = null;
      topRoots.forEach(p => {
        if (!drawn.has(p.id)) {
          let rootWidth = p.spouse ? computeSubtreeWidth(p.id, p.spouse) : computeSubtreeWidth(p.id, null);
          let midX = prevRightEdge === null ? currentMidX : prevRightEdge + FAMILY_GAP + rootWidth / 2;
          layoutCouple(p.id, p.spouse, midX, 220, familyIdxCounter, 0);
          familyIdxCounter++;
          prevRightEdge = midX + rootWidth / 2;
        }
      });
      let fallbackY = 100; let fallbackX = 100; people.forEach(p => { if (!drawn.has(p.id)) { coords[p.id] = { x: fallbackX, y: fallbackY }; drawn.add(p.id); genLevels[p.id] = 0; familyOf[p.id] = familyIdxCounter++; fallbackX += 160; } });
      return { coords, genLevels, familyOf };
    }

    function getFinalCoordinates() {
      let { coords: baseCoords, genLevels, familyOf } = calculateBaseCoordinates(); let finalCoords = {};
      Object.keys(baseCoords).forEach(id => { let offset = nodeOffsets[id] || { x: 0, y: 0 }; finalCoords[id] = { x: baseCoords[id].x + offset.x, y: baseCoords[id].y + offset.y }; });
      return { coords: finalCoords, genLevels, familyOf };
    }

    // 整理版面：清除所有人物手動拖曳的位移量，讓整張圖依自動排版邏輯重新置中排列
    // （新增子女等結構變動後，若之前有拖曳過人物位置，容易變得凌亂，可用此鍵一次整理乾淨）
    function autoArrangeLayout() {
      customConfirm('系統將自動排版人物位置，確定要重新整理嗎？', function (ok) {
        if (!ok) return;
        nodeOffsets = {};
        window.currentViewBox = null;
        renderGenogram();
        commitHistory();
      });
    }

    // ===== 人物圖案特殊樣式繪製（雙層外框／左上塗黑1/4） =====
    function appendOuterRing(g, pos, outerR, shapeType) {
      let outer;
      if (shapeType === 'rect') {
        outer = document.createElementNS(SVGNS, "rect");
        outer.setAttribute("x", pos.x - outerR); outer.setAttribute("y", pos.y - outerR);
        outer.setAttribute("width", outerR * 2); outer.setAttribute("height", outerR * 2);
      } else if (shapeType === 'circle') {
        outer = document.createElementNS(SVGNS, "circle");
        outer.setAttribute("cx", pos.x); outer.setAttribute("cy", pos.y); outer.setAttribute("r", outerR);
      } else {
        outer = document.createElementNS(SVGNS, "polygon");
        outer.setAttribute("points", `${pos.x},${pos.y - outerR} ${pos.x - outerR},${pos.y + outerR} ${pos.x + outerR},${pos.y + outerR}`);
      }
      outer.setAttribute("stroke", "black"); outer.setAttribute("stroke-width", "2"); outer.setAttribute("fill", "white");
      g.appendChild(outer);
    }
    function appendQuarterShade(g, pos, r, shapeType, personId) {
      const clipId = 'qshade-' + String(personId).replace(/[^a-zA-Z0-9_-]/g, '') + '-' + Math.floor(pos.x) + '-' + Math.floor(pos.y);
      let defs = document.createElementNS(SVGNS, "defs");
      let clip = document.createElementNS(SVGNS, "clipPath");
      clip.setAttribute("id", clipId);
      let clipRect = document.createElementNS(SVGNS, "rect");
      clipRect.setAttribute("x", pos.x - r); clipRect.setAttribute("y", pos.y - r);
      clipRect.setAttribute("width", r); clipRect.setAttribute("height", r);
      clip.appendChild(clipRect);
      defs.appendChild(clip);
      g.appendChild(defs);

      let shade;
      if (shapeType === 'rect') {
        shade = document.createElementNS(SVGNS, "rect");
        shade.setAttribute("x", pos.x - r); shade.setAttribute("y", pos.y - r);
        shade.setAttribute("width", r * 2); shade.setAttribute("height", r * 2);
      } else if (shapeType === 'circle') {
        shade = document.createElementNS(SVGNS, "circle");
        shade.setAttribute("cx", pos.x); shade.setAttribute("cy", pos.y); shade.setAttribute("r", r);
      } else {
        shade = document.createElementNS(SVGNS, "polygon");
        shade.setAttribute("points", `${pos.x},${pos.y - r} ${pos.x - r},${pos.y + r} ${pos.x + r},${pos.y + r}`);
      }
      // 淡淡塗黑（透明度低），避免蓋過中央的年齡數字辨識
      shade.setAttribute("fill", "#666666");
      shade.setAttribute("clip-path", `url(#${clipId})`);
      shade.style.pointerEvents = 'none';
      g.appendChild(shade);
    }

    // ===== 婚姻線特殊樣式繪製（正向親密／衝突／關係惡化／虛線，可任意組合疊加） =====
    function buildJitterPoints(x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux;
      const segments = Math.max(6, Math.round(len / 16));
      let pts = [];
      for (let i = 0; i <= segments; i++) {
        let t = i / segments;
        let bx = x1 + dx * t, by = y1 + dy * t;
        let amp = (i === 0 || i === segments) ? 0 : (9 * (i % 2 === 0 ? 1 : -1));
        pts.push([bx + px * amp, by + py * amp]);
      }
      return pts;
    }
    function pointsToPathD(pts) {
      return pts.map((p, i) => (i === 0 ? 'M' : 'L') + ` ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
    }
    function renderMarriageLineVisual(mg, p1, p2, style) {
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const px = -dy / len, py = dx / len; // 垂直於線段的單位向量，用於多線並排時的置中偏移
      const ux = dx / len, uy = dy / len;
      // 新增：手動建立的自訂關係線可透過上方工具列的「顏色」選取器個別改色；一般婚姻線／親子線則維持黑色
      const strokeColor = style.color || 'black';

      function makeStraightPath(a, b, offset) {
        let path = document.createElementNS(SVGNS, "path");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", strokeColor);
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        if (style.dashed) path.setAttribute("stroke-dasharray", "7,5");
        let ox = px * offset, oy = py * offset;
        path.setAttribute("d", `M ${a.x + ox} ${a.y + oy} L ${b.x + ox} ${b.y + oy}`);
        return path;
      }

      // 依樣式決定要並排畫幾條直線、各自粗細：預設 1 條、正向親密 2 條（平均置中）、
      // 過度親密 3 條（中間一條較粗，兩側較細）
      let offsets, thicknesses;
      if (style.overintimate) { offsets = [-5, 0, 5]; thicknesses = [2, 4, 2]; }
      else if (style.positive) { offsets = [-3, 3]; thicknesses = [2, 2]; }
      else { offsets = [0]; thicknesses = [2]; }

      // 「衝突」若單獨套用（未同時搭配正向親密／過度親密）：直接以鋸齒狀線段取代原本的直線；
      // 若與正向親密／過度親密同時套用：保留原本並排的直線不變，再疊加畫上衝突的鋸齒樣式於正中央
      // （直接在既有線段上疊加衝突樣式，例如「正向親密＋衝突」＝「衝突又親密」）
      let drawStraightBase = !(style.conflict && !style.positive && !style.overintimate);

      if (drawStraightBase) {
        if (style.cutoff) {
          // 溝通中斷／關係中斷：線段中間留白缺口，缺口兩側加上直立刻痕（類似開關符號的樣子）
          const gapHalf = 10;
          const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
          const gapA = { x: midX - ux * gapHalf, y: midY - uy * gapHalf };
          const gapB = { x: midX + ux * gapHalf, y: midY + uy * gapHalf };
          offsets.forEach((offset, i) => {
            let pathA = makeStraightPath(p1, gapA, offset); pathA.setAttribute("stroke-width", thicknesses[i]); mg.appendChild(pathA);
            let pathB = makeStraightPath(gapB, p2, offset); pathB.setAttribute("stroke-width", thicknesses[i]); mg.appendChild(pathB);
          });
          [gapA, gapB].forEach(pt => {
            let tick = document.createElementNS(SVGNS, "line");
            let th = 9;
            tick.setAttribute("x1", pt.x - px * th); tick.setAttribute("y1", pt.y - py * th);
            tick.setAttribute("x2", pt.x + px * th); tick.setAttribute("y2", pt.y + py * th);
            tick.setAttribute("stroke", strokeColor); tick.setAttribute("stroke-width", "2.5"); tick.setAttribute("stroke-linecap", "round");
            mg.appendChild(tick);
          });
        } else {
          offsets.forEach((offset, i) => {
            let path = makeStraightPath(p1, p2, offset);
            path.setAttribute("stroke-width", thicknesses[i]);
            mg.appendChild(path);
          });
        }
      }

      if (style.conflict) {
        // 直接在既有線段（不論單線／正向親密雙線／過度親密三線）正中央疊加畫上鋸齒狀的衝突樣式
        let pts = buildJitterPoints(p1.x, p1.y, p2.x, p2.y);
        let conflictPath = document.createElementNS(SVGNS, "path");
        conflictPath.setAttribute("fill", "none");
        conflictPath.setAttribute("stroke", strokeColor);
        conflictPath.setAttribute("stroke-width", "2");
        conflictPath.setAttribute("stroke-linecap", "round");
        conflictPath.setAttribute("stroke-linejoin", "round");
        if (style.dashed) conflictPath.setAttribute("stroke-dasharray", "7,5");
        conflictPath.setAttribute("d", pointsToPathD(pts));
        mg.appendChild(conflictPath);
      }

      if (style.deteriorate) {
        // 關係惡化：沿線段等距畫上斜線刻痕
        // 【修改間距】：把 26 改成 45（數字越大，刻痕越少、間距越寬）
        const tickCount = Math.max(3, Math.round(len / 45));
        for (let i = 1; i < tickCount; i++) {
          let t = i / tickCount;
          let bx = p1.x + dx * t, by = p1.y + dy * t;
          // 【修改長度】：把 8 改成 14（數字越大，斜線刻痕越長）
          let half = 14;
          let tick = document.createElementNS(SVGNS, "line");
          tick.setAttribute("x1", bx - ux * half - px * half * 0.6);
          tick.setAttribute("y1", by - uy * half - py * half * 0.6);
          tick.setAttribute("x2", bx + ux * half + px * half * 0.6);
          tick.setAttribute("y2", by + uy * half + py * half * 0.6);
          tick.setAttribute("stroke", strokeColor); tick.setAttribute("stroke-width", "2.5"); tick.setAttribute("stroke-linecap", "round");
          mg.appendChild(tick);
        }
      }
    }

    // 新增：親子連接線「分岔後」的各線段，包一層 <g> 並標記唯一鍵值，沿用婚姻線的點選／樣式套用邏輯，
    // 讓每一段親子關係線（而不只是婚姻線）都能個別點選並套用「人物關係」樣式（正向親密／衝突／關係惡化／虛線）
    function appendRelLineGroup(container, key, p1, p2) {
      let rg = document.createElementNS(SVGNS, "g");
      rg.classList.add('marriage-line-group');
      rg.setAttribute('data-pair-key', key);
      if (selectedMarriageKey === key) rg.classList.add('selected-el');
      {
        let curDrawMode = document.getElementById('draw-mode') ? document.getElementById('draw-mode').value : 'select';
        rg.style.cursor = (curDrawMode === 'select') ? 'pointer' : 'default';
      }
      let rHit = document.createElementNS(SVGNS, "line");
      rHit.setAttribute("x1", p1.x); rHit.setAttribute("y1", p1.y); rHit.setAttribute("x2", p2.x); rHit.setAttribute("y2", p2.y);
      rHit.setAttribute("stroke", "transparent"); rHit.setAttribute("stroke-width", "16");
      rg.appendChild(rHit);
      renderMarriageLineVisual(rg, p1, p2, marriageLineStyles[key] || {});
      container.appendChild(rg);
      return rg;
    }

    // 右側樣式面板（.style-side-panel）是固定於畫面的 HTML 覆蓋層，本身不會隨 SVG 畫布縮放連動；
    // 這裡依「目前 viewBox 寬度」相對於「第一次自動置中時的基準寬度」算出縮放比例，
    // 畫布放大（viewBox 變窄）時面板同步等比縮小，避免遮擋過多畫面；畫布縮小則最多恢復原尺寸、不會放大超過。
    // 使用開根號讓縮小幅度較和緩，並設下限（0.6）避免面板小到難以點擊操作。
    function updateStylePanelZoomScale() {
      const panel = document.querySelector('.style-side-panel');
      if (!panel || !window.currentViewBox) return;
      if (!window.stylePanelBaseViewW) window.stylePanelBaseViewW = window.currentViewBox.w;
      let ratio = window.currentViewBox.w / window.stylePanelBaseViewW;
      let scale = Math.min(1, Math.max(0.6, Math.sqrt(ratio)));
      panel.style.transformOrigin = 'right center';
      panel.style.transform = `translateY(-50%) scale(${scale})`;
    }

    function renderGenogram() {
      while (autoLayer.firstChild) autoLayer.removeChild(autoLayer.firstChild);
      let { coords, genLevels, familyOf } = getFinalCoordinates();
      let minX = Infinity, maxX = -Infinity, minY = 0, maxY = 600;
      Object.values(coords).forEach(c => { if (c.x < minX) minX = c.x; if (c.x > maxX) maxX = c.x; if (c.y > maxY) maxY = c.y; });
      if (minX === Infinity) minX = 0; if (maxX === -Infinity) maxX = 1200;
      minX = Math.min(0, minX - 150); maxX = Math.max(1200, maxX + 150); maxY = Math.max(600, maxY + 150);

      if (!window.currentViewBox) {
        window.currentViewBox = { x: minX, y: minY, w: Math.max(maxX - minX, 1200), h: Math.max(maxY - minY, 700) };
        window.stylePanelBaseViewW = window.currentViewBox.w;
      }
      svg.setAttribute("viewBox", `${window.currentViewBox.x} ${window.currentViewBox.y} ${window.currentViewBox.w} ${window.currentViewBox.h}`);
      updateStylePanelZoomScale();

      const gGenBg = document.createElementNS("http://www.w3.org/2000/svg", "g");
      gGenBg.setAttribute('id', 'gen-bg-layer');
      const gCohabit = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const gLines = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const gNodes = document.createElementNS("http://www.w3.org/2000/svg", "g");
      autoLayer.appendChild(gGenBg); autoLayer.appendChild(gCohabit); autoLayer.appendChild(gLines); autoLayer.appendChild(gNodes);

      // 依「獨立家族＋世代深度」將人物分組：由上方按鈕新增的每個人都自成一個新的獨立家族，
      // 不需在意其落於整體畫布上的第幾代，各自以獨立底色圈起；同一家族內，配偶所在的根節點與子女代則分別使用不同底色。

    function buildSmoothClosedPath(pts) {
