<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>家系圖工具 Word 增益集</title>
  <!-- 引入 Office.js API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 10px;
      background-color: #f4f6f9;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      margin-bottom: 12px;
    }

    h3 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 16px;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 8px;
    }

    .person-row {
      border: 1px solid #e1e8ed;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 6px;
      background: #fafbfc;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    .field-group label {
      font-weight: bold;
      margin-bottom: 2px;
      color: #555;
    }

    select,
    input {
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-add {
      background: #28a745;
      margin-bottom: 10px;
    }

    .btn-clear {
      background: #dc3545;
      color: white;
      margin-left: 10px;
      margin-bottom: 10px;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-danger {
      background: #dc3545;
      padding: 3px 8px;
      font-size: 12px;
      margin-top: 15px;
    }

    .btn-sync {
      background: #6f42c1;
    }

    .btn-word {
      background: #28a745;
      margin-left: 10px;
    }

    #status-bar {
      font-weight: bold;
      font-size: 13px;
      color: #28a745;
      margin-left: 10px;
    }

    #canvas-container {
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      overflow: auto;
      max-height: 700px;
      border: 1px solid #ccc;
      position: relative;
    }

    svg {
      background: #fff;
      display: block;
      margin: 0 auto;
      user-select: none;
    }

    .selected-el {
      filter: drop-shadow(0px 0px 4px red);
      outline: none;
    }

    .draggable-node {
      cursor: move;
    }
  </style>
</head>

<body>

  <div class="card">
    <h3>1. 人員資料設定 <span id="status-bar">● 系統準備就緒</span></h3>
    <button class="btn-add" onclick="addPerson()">+ 新增人員</button>
    <button class="btn-clear" onclick="clearAllPeople()">清除所有人</button>
    <div id="people-container"></div>
  </div>

  <div class="card">
    <h3>2. 同居 / 同住圈選群組</h3>
    <button class="btn-add" onclick="addCohabitGroup()">+ 新增同居圈選區</button>
    <div id="cohabit-container"></div>
  </div>

  <div class="card" style="text-align: center;">
    <button class="btn-sync" onclick="syncToBackend('手動點擊同步')"
      style="font-size: 15px; font-weight: bold; padding: 8px 20px;">💾 儲存進度 (瀏覽器)</button>
    <button onclick="downloadSVG()"
      style="font-size: 15px; font-weight: bold; padding: 8px 20px; background: #17a2b8;">🖼️ 下載家系圖</button>
    <!-- 新增：插入至 Word 的按鈕 -->
    <button class="btn-word" onclick="insertIntoWord()"
      style="font-size: 15px; font-weight: bold; padding: 8px 20px;">📝 插入至 Word 文件</button>
  </div>

  <!-- 畫布標註工具列 -->
  <div class="card" style="background:#eef6fc;">
    <h3>3. 畫布標註與繪圖工具 (人員圖案皆可滑鼠直接拖移)</h3>
    <div style="display:flex; gap:15px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
      <div style="background:#fff; padding:5px 10px; border-radius:5px; border:1px solid #ccc;">
        <label style="font-weight:bold; color:#000000;">🛠️ 模式：</label>
        <select id="draw-mode" style="font-size:14px; padding:3px;">
          <option value="select">👆 選取/移動/修改</option>
          <option value="text">T 新增文字(點擊下方畫布)</option>
          <option value="freehand">✏️ 任意畫筆</option>
          <option value="line">📏 畫直線</option>
        </select>
      </div>
      <div style="background:#fff; padding:5px 10px; border-radius:5px; border:1px solid #ccc;">
        <label style="font-weight:bold; color:#000000;">🎨 顏色：</label>
        <input type="color" id="draw-color" value="#000000" onchange="changeColorSelected()">
      </div>
      <div style="background:#fff; padding:5px 10px; border-radius:5px; border:1px solid #ccc;">
        <label style="font-weight:bold; color:#000000;">📏 粗細(筆)/大小(字)：</label>
        <input type="number" id="draw-size" value="4" style="width:50px;">
      </div>
    </div>

    <div
      style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding-top:10px; border-top:1px dashed #b8daff; width:100%;">
      <label style="font-weight:bold; color:#0056b3;">針對「選取中的物件」：</label>
      <button onclick="transformSelected('scale', 1.1)" style="background:#28a745;">🔍 放大</button>
      <button onclick="transformSelected('scale', 0.9)" style="background:#28a745;">🔎 縮小</button>
      <button onclick="transformSelected('rotate', 15)" style="background:#ffc107; color:black;">↻ 順時針轉</button>
      <button onclick="transformSelected('rotate', -15)" style="background:#ffc107; color:black;">↺ 逆時針轉</button>
      <button onclick="transformSelected('delete')" class="btn-danger" style="margin-top:0;">🗑️ 刪除選取物件</button>
      <button onclick="deleteAllCustomObjects()"
        style="margin-left:auto; background:#dc3545; color:white; font-weight:bold;">💥 刪除所有物件</button>
    </div>
  </div>

  <div class="card">
    <h3>4. 家系圖預覽區</h3>
    <div id="canvas-container">
      <svg id="genogram-svg">
        <g id="auto-layer"></g>
        <g id="custom-layer"></g>
      </svg>
    </div>
  </div>

  <script>
    // 初始化 Office Add-in
    Office.onReady((info) => {
      if (info.host === Office.HostType.Word) {
        document.getElementById('status-bar').innerText = '● Word 環境已連線';
      }
    });

    // 本地儲存與載入機制 (取代 Colab Python 後端)
    const LOCAL_STORAGE_KEY = "genogram_save_data";
    const defaultData = {
      people: [
        { "id": "A", "gender": "M", "age": "", "disability": "否", "status": "存", "isClient": "是", "spouse": "B", "hasChildren": "否", "children": [], "isTwin": "否", "twinSiblings": [] },
        { "id": "B", "gender": "F", "age": "", "disability": "否", "status": "存", "isClient": "否", "spouse": "A", "hasChildren": "否", "children": [], "isTwin": "否", "twinSiblings": [] }
      ],
      cohabitGroups: []
    };

    function loadFromBackend() {
      const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (saved) {
        try { return JSON.parse(saved); } catch (e) { return defaultData; }
      }
      return defaultData;
    }

    function syncToBackend(actionDesc) {
      const payload = { people: people, cohabitGroups: cohabitGroups };
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
      const statusBar = document.getElementById('status-bar');
      statusBar.innerText = '● 已自動儲存';
      statusBar.style.color = '#28a745';
    }

    let backendState = loadFromBackend();
    let people = backendState.people || [];
    let cohabitGroups = backendState.cohabitGroups || [];
    let nodeOffsets = {};

    let isDrawing = false; let isDraggingNode = false; let draggedNodeId = null;
    let startPt = null; let currentDrawEl = null; let selectedEl = null;

    const svg = document.getElementById('genogram-svg');
    const autoLayer = document.getElementById('auto-layer');
    const customLayer = document.getElementById('custom-layer');

    function getNextID() {
      const used = people.map(p => p.id);
      for (let i = 0; i < 26; i++) {
        let char = String.fromCharCode(65 + i);
        if (!used.includes(char)) return char;
      }
      return 'P' + (people.length + 1);
    }

    // === 下面是原本完整的表單與繪圖邏輯 ===
    function renderForms() {
      const container = document.getElementById('people-container');
      container.innerHTML = '';
      people.forEach((p, index) => {
        const row = document.createElement('div'); row.className = 'person-row';
        let spouseOpts = `<option value="">無</option>` + people.filter(x => x.id !== p.id).map(x => `<option value="${x.id}" ${p.spouse === x.id ? 'selected' : ''}>${x.id}</option>`).join('');
        let childOpts = people.filter(x => x.id !== p.id && x.id !== p.spouse).map(x => `
      <label style="font-weight:normal; font-size:12px; margin-right:5px;"><input type="checkbox" onchange="toggleChild('${p.id}', '${x.id}')" ${p.children && p.children.includes(x.id) ? 'checked' : ''}> ${x.id}</label>
    `).join('');
        let twinOpts = people.filter(x => x.id !== p.id && x.isTwin === '是').map(x => `
      <label style="font-weight:normal; font-size:12px; margin-right:5px; color:#c0392b;"><input type="checkbox" onchange="toggleTwin('${p.id}', '${x.id}')" ${p.twinSiblings && p.twinSiblings.includes(x.id) ? 'checked' : ''}> 連結 ${x.id}</label>
    `).join('');

        row.innerHTML = `
      <div class="field-group"><label>ID</label><strong style="font-size:15px; color:#007bff; padding-top:4px;">${p.id}</strong></div>
      <div class="field-group" style="background:#e8f4f8; padding:2px 6px; border-radius:4px;"><label style="color:#0056b3;">案主</label><input type="checkbox" onchange="updatePerson('${p.id}', 'isClient', this.checked ? '是' : '否')" ${p.isClient === '是' ? 'checked' : ''} style="cursor:pointer; margin-top:4px;"></div>
      <div class="field-group"><label>性別</label><select onchange="updatePerson('${p.id}', 'gender', this.value)"><option value="M" ${p.gender === 'M' ? 'selected' : ''}>男</option><option value="F" ${p.gender === 'F' ? 'selected' : ''}>女</option><option value="U" ${p.gender === 'U' ? 'selected' : ''}>未知</option></select></div>
      <div class="field-group"><label>年齡</label><input type="number" style="width:50px;" value="${p.age}" onchange="updatePerson('${p.id}', 'age', this.value)" placeholder="空白"></div>
      <div class="field-group"><label>身障</label><select onchange="updatePerson('${p.id}', 'disability', this.value)"><option value="否" ${p.disability === '否' ? 'selected' : ''}>否</option><option value="是" ${p.disability === '是' ? 'selected' : ''}>是</option></select></div>
      <div class="field-group"><label>存歿</label><select onchange="updatePerson('${p.id}', 'status', this.value)"><option value="存" ${p.status === '存' ? 'selected' : ''}>存</option><option value="歿" ${p.status === '歿' ? 'selected' : ''}>歿</option></select></div>
      <div class="field-group"><label>配偶(男左女右)</label><select onchange="updatePerson('${p.id}', 'spouse', this.value)">${spouseOpts}</select></div>
      <div class="field-group" style="background:#fff3cd; padding:2px 5px; border-radius:4px;"><label>雙胞胎</label><select onchange="updatePerson('${p.id}', 'isTwin', this.value)"><option value="否" ${p.isTwin === '否' ? 'selected' : ''}>否</option><option value="是" ${p.isTwin === '是' ? 'selected' : ''}>是</option></select></div>
      ${p.isTwin === '是' ? `<div class="field-group" style="background:#fff3cd; padding:2px 5px; border-radius:4px;"><label>雙胞胎手足</label><div>${twinOpts || '無'}</div></div>` : ''}
      <div class="field-group"><label>子女</label><select onchange="updatePerson('${p.id}', 'hasChildren', this.value)"><option value="否" ${p.hasChildren === '否' ? 'selected' : ''}>否</option><option value="是" ${p.hasChildren === '是' ? 'selected' : ''}>是</option></select></div>
      ${p.hasChildren === '是' ? `<div class="field-group"><label>勾選子女ID</label><div>${childOpts}</div></div>` : ''}
      <div class="field-group" style="flex-direction:row; gap:5px; align-items:center; margin-top:15px; margin-left:auto;">
        <button class="btn-danger" style="margin-top:0;" onclick="removePerson('${p.id}')">刪除</button>
        <button onclick="movePersonUp(${index})" style="background:#CCDDFF; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">⬆️</button>
        <button onclick="movePersonDown(${index})" style="background:#CCDDFF; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">⬇️</button>
      </div>
    `;
        container.appendChild(row);
      });
      renderCohabitForms(); renderGenogram();
    }

    function renderCohabitForms() {
      const container = document.getElementById('cohabit-container'); container.innerHTML = '';
      cohabitGroups.forEach((group, gIdx) => {
        const div = document.createElement('div'); div.style.cssText = 'display:flex; align-items:center; gap:10px; margin-bottom:10px; background:#fafbfc; padding:10px; border:1px solid #e1e8ed; border-radius:6px;';
        let checkboxes = people.map(p => `<label style="font-size:13px; margin-right:8px; cursor:pointer;"><input type="checkbox" onchange="toggleCohabitMember(${gIdx}, '${p.id}')" ${group.includes(p.id) ? 'checked' : ''}> ${p.id}</label>`).join('');
        div.innerHTML = `<strong style="font-size:14px; color:#2c3e50;">同住圈 ${gIdx + 1}：</strong><div style="flex-grow:1;">${checkboxes}</div><button class="btn-danger" style="margin-top:0;" onclick="removeCohabitGroup(${gIdx})">刪除</button>`;
        container.appendChild(div);
      });
    }

    function clearAllPeople() { if (confirm("確定清除所有人？")) { people = []; cohabitGroups = []; nodeOffsets = {}; renderForms(); syncToBackend(); } }
    function addPerson() { people.push({ id: getNextID(), gender: 'M', age: '', disability: '否', status: '存', isClient: '否', spouse: '', hasChildren: '否', children: [], isTwin: '否', twinSiblings: [] }); renderForms(); syncToBackend(); }
    function removePerson(id) { people = people.filter(p => p.id !== id); people.forEach(p => { if (p.spouse === id) p.spouse = ''; if (p.children) p.children = p.children.filter(c => c !== id); if (p.twinSiblings) p.twinSiblings = p.twinSiblings.filter(c => c !== id); }); cohabitGroups = cohabitGroups.map(g => g.filter(x => x !== id)); delete nodeOffsets[id]; renderForms(); syncToBackend(); }
    function movePersonUp(idx) { if (idx > 0) { let temp = people[idx]; people[idx] = people[idx - 1]; people[idx - 1] = temp; renderForms(); syncToBackend(); } }
    function movePersonDown(idx) { if (idx < people.length - 1) { let temp = people[idx]; people[idx] = people[idx + 1]; people[idx + 1] = temp; renderForms(); syncToBackend(); } }
    function updatePerson(id, field, val) { const p = people.find(x => x.id === id); if (p) { p[field] = val; if (field === 'spouse' && val) { const spouseObj = people.find(x => x.id === val); if (spouseObj) spouseObj.spouse = id; } } renderForms(); syncToBackend(); }
    function toggleChild(parentId, childId) { const p = people.find(x => x.id === parentId); if (p) { if (!p.children) p.children = []; if (p.children.includes(childId)) p.children = p.children.filter(c => c !== childId); else p.children.push(childId); } renderForms(); syncToBackend(); }
    function toggleTwin(id1, id2) { const p1 = people.find(x => x.id === id1); const p2 = people.find(x => x.id === id2); if (!p1.twinSiblings) p1.twinSiblings = []; if (!p2.twinSiblings) p2.twinSiblings = []; if (p1.twinSiblings.includes(id2)) { p1.twinSiblings = p1.twinSiblings.filter(x => x !== id2); p2.twinSiblings = p2.twinSiblings.filter(x => x !== id1); } else { p1.twinSiblings.push(id2); p2.twinSiblings.push(id1); } renderForms(); syncToBackend(); }
    function addCohabitGroup() { cohabitGroups.push([]); renderCohabitForms(); syncToBackend(); }
    function removeCohabitGroup(gIdx) { cohabitGroups.splice(gIdx, 1); renderCohabitForms(); renderGenogram(); syncToBackend(); }
    function toggleCohabitMember(gIdx, personId) { if (cohabitGroups[gIdx].includes(personId)) { cohabitGroups[gIdx] = cohabitGroups[gIdx].filter(x => x !== personId); } else { cohabitGroups[gIdx].push(personId); } renderGenogram(); syncToBackend(); }

    function getConvexHull(points) {
      if (points.length <= 2) return points; points.sort((a, b) => a.x !== b.x ? a.x - b.x : a.y - b.y);
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const lower = []; for (let i = 0; i < points.length; i++) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], points[i]) <= 0) lower.pop(); lower.push(points[i]); }
      const upper = []; for (let i = points.length - 1; i >= 0; i--) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], points[i]) <= 0) upper.pop(); upper.push(points[i]); }
      upper.pop(); lower.pop(); return lower.concat(upper);
    }

    function calculateBaseCoordinates() {
      let coords = {}; let drawn = new Set(); let isChild = {};
      people.forEach(p => { (p.children || []).forEach(cId => { isChild[cId] = true; }); });
      let topRoots = people.filter(p => !isChild[p.id]);
      function layoutCouple(p1Id, p2Id, midX, y) {
        if (drawn.has(p1Id)) return;
        let p1Obj = people.find(x => x.id === p1Id); let p2Obj = p2Id ? people.find(x => x.id === p2Id) : null;
        let leftId = p1Id, rightId = p2Id;
        if (p2Obj) {
          if (p1Obj.gender === 'F' && p2Obj.gender === 'M') { leftId = p2Id; rightId = p1Id; }
          else if (p1Obj.gender === 'M' && p2Obj.gender === 'F') { leftId = p1Id; rightId = p2Id; }
          coords[leftId] = { x: midX - 70, y: y }; coords[rightId] = { x: midX + 70, y: y };
          drawn.add(leftId); drawn.add(rightId);
        } else { coords[p1Id] = { x: midX, y: y }; drawn.add(p1Id); }
        let childrenSet = new Set(p1Obj ? (p1Obj.children || []) : []);
        if (p2Obj) { (p2Obj.children || []).forEach(cId => childrenSet.add(cId)); }
        let rawChildren = Array.from(childrenSet); rawChildren.sort((a, b) => people.findIndex(x => x.id === a) - people.findIndex(x => x.id === b));
        let children = []; let visitedChild = new Set();
        rawChildren.forEach(cId => {
          if (visitedChild.has(cId)) return; let childObj = people.find(x => x.id === cId);
          if (childObj && childObj.isTwin === '是' && childObj.twinSiblings) {
            let siblingsInThisFamily = childObj.twinSiblings.filter(tid => rawChildren.includes(tid));
            siblingsInThisFamily.sort((a, b) => people.findIndex(x => x.id === a) - people.findIndex(x => x.id === b));
            children.push(cId); visitedChild.add(cId);
            siblingsInThisFamily.forEach(tid => { if (!visitedChild.has(tid)) { children.push(tid); visitedChild.add(tid); } });
          } else { children.push(cId); visitedChild.add(cId); }
        });
        if (children.length > 0) {
          let widths = children.map(cId => { let childObj = people.find(x => x.id === cId); return (childObj && childObj.spouse) ? 280 : 180; });
          let totalW = widths.reduce((a, b) => a + b, 0); let startX = midX - totalW / 2; let currentX = startX;
          children.forEach((cId, i) => {
            let cx = currentX + widths[i] / 2; currentX += widths[i];
            let childObj = people.find(x => x.id === cId);
            if (childObj) { if (childObj.spouse && !drawn.has(childObj.spouse)) layoutCouple(cId, childObj.spouse, cx, y + 170); else layoutCouple(cId, null, cx, y + 170); }
          });
        }
      }
      let currentMidX = 600; topRoots.forEach(p => { if (!drawn.has(p.id)) { layoutCouple(p.id, p.spouse, currentMidX, 100); currentMidX += 450; } });
      let fallbackY = 100; let fallbackX = 100; people.forEach(p => { if (!drawn.has(p.id)) { coords[p.id] = { x: fallbackX, y: fallbackY }; drawn.add(p.id); fallbackX += 160; } });
      return coords;
    }

    function getFinalCoordinates() {
      let baseCoords = calculateBaseCoordinates(); let finalCoords = {};
      Object.keys(baseCoords).forEach(id => { let offset = nodeOffsets[id] || { x: 0, y: 0 }; finalCoords[id] = { x: baseCoords[id].x + offset.x, y: baseCoords[id].y + offset.y }; });
      return finalCoords;
    }

    function renderGenogram() {
      autoLayer.innerHTML = ''; let coords = getFinalCoordinates();
      let minX = Infinity, maxX = -Infinity, minY = 0, maxY = 600;
      Object.values(coords).forEach(c => { if (c.x < minX) minX = c.x; if (c.x > maxX) maxX = c.x; if (c.y > maxY) maxY = c.y; });
      if (minX === Infinity) minX = 0; if (maxX === -Infinity) maxX = 1200;
      minX = Math.min(0, minX - 150); maxX = Math.max(1200, maxX + 150); maxY = Math.max(600, maxY + 150);
      let width = maxX - minX; let height = maxY - minY;
      svg.setAttribute("width", width); svg.setAttribute("height", height); svg.setAttribute("viewBox", `${minX} ${minY} ${width} ${height}`);
      const gCohabit = document.createElementNS("http://www.w3.org/2000/svg", "g"); const gLines = document.createElementNS("http://www.w3.org/2000/svg", "g"); const gNodes = document.createElementNS("http://www.w3.org/2000/svg", "g");
      autoLayer.appendChild(gCohabit); autoLayer.appendChild(gLines); autoLayer.appendChild(gNodes);

      let drawnMarriages = new Set();
      people.forEach(p => {
        if (p.spouse && coords[p.spouse] && !drawnMarriages.has([p.id, p.spouse].sort().join('-'))) {
          drawnMarriages.add([p.id, p.spouse].sort().join('-'));
          let p1 = coords[p.id], p2 = coords[p.spouse];
          let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", p1.x); line.setAttribute("y1", p1.y); line.setAttribute("x2", p2.x); line.setAttribute("y2", p2.y);
          line.setAttribute("stroke", "black"); line.setAttribute("stroke-width", "2"); gLines.appendChild(line);

          let children = p.children || []; const spouseObj = people.find(x => x.id === p.spouse);
          if (spouseObj && spouseObj.children) children = [...new Set([...children, ...spouseObj.children])];
          if (children.length > 0) {
            let midX = (p1.x + p2.x) / 2; let busY = Math.min(p1.y, p2.y) + 70;
            let vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            vLine.setAttribute("x1", midX); vLine.setAttribute("y1", (p1.y + p2.y) / 2); vLine.setAttribute("x2", midX); vLine.setAttribute("y2", busY); vLine.setAttribute("stroke", "black"); vLine.setAttribute("stroke-width", "2"); gLines.appendChild(vLine);
            let busXs = [midX]; let drawnChildLines = new Set();
            children.forEach(cId => {
              let childObj = people.find(x => x.id === cId); let c = coords[cId]; if (!c) return;
              if (childObj.isTwin === '是' && childObj.twinSiblings) {
                let actualTwins = childObj.twinSiblings.filter(tid => children.includes(tid) && coords[tid]);
                if (actualTwins.length > 0) {
                  let allTwinIds = [cId, ...actualTwins]; let xs = allTwinIds.map(id => coords[id].x); busXs.push(xs.reduce((a, b) => a + b, 0) / xs.length);
                } else { busXs.push(c.x); }
              } else { busXs.push(c.x); }
            });
            let hBus = document.createElementNS("http://www.w3.org/2000/svg", "line");
            hBus.setAttribute("x1", Math.min(...busXs)); hBus.setAttribute("y1", busY); hBus.setAttribute("x2", Math.max(...busXs)); hBus.setAttribute("y2", busY); hBus.setAttribute("stroke", "black"); hBus.setAttribute("stroke-width", "2"); gLines.appendChild(hBus);

            children.forEach(cId => {
              if (drawnChildLines.has(cId)) return; let childObj = people.find(x => x.id === cId); let c = coords[cId]; if (!c) return;
              if (childObj.isTwin === '是' && childObj.twinSiblings) {
                let actualTwins = childObj.twinSiblings.filter(tid => children.includes(tid) && coords[tid]);
                if (actualTwins.length > 0) {
                  let allTwinIds = [cId, ...actualTwins]; let xs = allTwinIds.map(id => coords[id].x); let twinMidX = xs.reduce((a, b) => a + b, 0) / xs.length;
                  allTwinIds.forEach(id => {
                    let tc = coords[id]; let cLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    cLine.setAttribute("x1", twinMidX); cLine.setAttribute("y1", busY); cLine.setAttribute("x2", tc.x); cLine.setAttribute("y2", tc.y - 26); cLine.setAttribute("stroke", "black"); cLine.setAttribute("stroke-width", "2"); gLines.appendChild(cLine); drawnChildLines.add(id);
                  });
                  return;
                }
              }
              let cLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
              cLine.setAttribute("x1", c.x); cLine.setAttribute("y1", busY); cLine.setAttribute("x2", c.x); cLine.setAttribute("y2", c.y - 26); cLine.setAttribute("stroke", "black"); cLine.setAttribute("stroke-width", "2"); gLines.appendChild(cLine); drawnChildLines.add(cId);
            });
          }
        }
      });

      people.forEach(p => {
        let pos = coords[p.id]; if (!pos) return;
        let g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("class", "draggable-node"); g.setAttribute("data-person-id", p.id);

        // 【修改區域】：將案主的樣式改成單層塗灰，同時身障顏色稍微改深以做區別
        let r = 26;
        let shapeHalfColor = "#666666";
        let baseFillColor = p.isClient === '是' ? "#cccccc" : "white"; // 案主設定為淺灰色背景

        if (p.gender === 'M') {
          let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", pos.x - r); rect.setAttribute("y", pos.y - r);
          rect.setAttribute("width", r * 2); rect.setAttribute("height", r * 2);
          rect.setAttribute("stroke", "black"); rect.setAttribute("stroke-width", "2");
          rect.setAttribute("fill", baseFillColor);
          g.appendChild(rect);

          if (p.disability === '是') {
            let half = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            half.setAttribute("x", pos.x); half.setAttribute("y", pos.y - r);
            half.setAttribute("width", r); half.setAttribute("height", r * 2);
            half.setAttribute("fill", shapeHalfColor); half.setAttribute("stroke", "black"); half.setAttribute("stroke-width", "1");
            g.appendChild(half);
          }
        } else if (p.gender === 'F') {
          let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", pos.x); circle.setAttribute("cy", pos.y);
          circle.setAttribute("r", r);
          circle.setAttribute("stroke", "black"); circle.setAttribute("stroke-width", "2");
          circle.setAttribute("fill", baseFillColor);
          g.appendChild(circle);

          if (p.disability === '是') {
            let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${pos.x} ${pos.y - r} A ${r} ${r} 0 0 1 ${pos.x} ${pos.y + r} Z`);
            path.setAttribute("fill", shapeHalfColor); path.setAttribute("stroke", "black"); path.setAttribute("stroke-width", "1");
            g.appendChild(path);
          }
        } else {
          let poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          poly.setAttribute("points", `${pos.x},${pos.y - r} ${pos.x - r},${pos.y + r} ${pos.x + r},${pos.y + r}`);
          poly.setAttribute("stroke", "black"); poly.setAttribute("stroke-width", "2");
          poly.setAttribute("fill", baseFillColor);
          g.appendChild(poly);

          if (p.disability === '是') {
            let halfPoly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            halfPoly.setAttribute("points", `${pos.x},${pos.y - r} ${pos.x},${pos.y + r} ${pos.x + r},${pos.y + r}`);
            halfPoly.setAttribute("fill", shapeHalfColor);
            g.appendChild(halfPoly);
          }
        }
        // 【結束修改區域】

        if (p.status === '歿') {
          let l1 = document.createElementNS("http://www.w3.org/2000/svg", "line"); l1.setAttribute("x1", pos.x - r); l1.setAttribute("y1", pos.y - r); l1.setAttribute("x2", pos.x + r); l1.setAttribute("y2", pos.y + r); l1.setAttribute("stroke", "black"); l1.setAttribute("stroke-width", "2");
          let l2 = document.createElementNS("http://www.w3.org/2000/svg", "line"); l2.setAttribute("x1", pos.x + r); l2.setAttribute("y1", pos.y - r); l2.setAttribute("x2", pos.x - r); l2.setAttribute("y2", pos.y + r); l2.setAttribute("stroke", "black"); l2.setAttribute("stroke-width", "2");
          g.appendChild(l1); g.appendChild(l2);
        }
        if (p.age) {
          let text = document.createElementNS("http://www.w3.org/2000/svg", "text"); text.setAttribute("x", pos.x); text.setAttribute("y", pos.y + 13); text.setAttribute("text-anchor", "middle"); text.setAttribute("font-size", "32"); text.setAttribute("font-weight", "bold"); text.setAttribute("fill", "black"); text.textContent = p.age; g.appendChild(text);
        }
        let label = document.createElementNS("http://www.w3.org/2000/svg", "text"); label.setAttribute("x", pos.x + r + 5); label.setAttribute("y", pos.y - r + 10); label.setAttribute("text-anchor", "start"); label.setAttribute("font-size", "13"); label.setAttribute("font-weight", "bold"); label.setAttribute("fill", "#007bff"); label.setAttribute("class", "person-id-label"); label.textContent = p.id; g.appendChild(label);
        gNodes.appendChild(g);
      });

      cohabitGroups.forEach(group => {
        let validPts = group.map(id => coords[id]).filter(c => c !== undefined); if (validPts.length === 0) return;
        let bufferRadius = 40; let expandedPoints = [];
        validPts.forEach(p => { for (let i = 0; i < 16; i++) { let angle = (Math.PI * 2 * i) / 16; expandedPoints.push({ x: p.x + bufferRadius * Math.cos(angle), y: p.y + bufferRadius * Math.sin(angle) }); } });
        let hull = getConvexHull(expandedPoints);
        if (hull.length > 0) {
          let pathData = "M " + hull.map(pt => `${pt.x},${pt.y}`).join(" L ") + " Z";
          let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", pathData); path.setAttribute("stroke", "black"); path.setAttribute("stroke-width", "2"); path.setAttribute("fill", "none"); path.setAttribute("stroke-linejoin", "round"); gCohabit.appendChild(path);
        }
      });
    }

    function getMousePos(evt) { var CTM = svg.getScreenCTM(); return { x: (evt.clientX - CTM.e) / CTM.a, y: (evt.clientY - CTM.f) / CTM.d }; }
    function selectElement(el) { if (selectedEl) selectedEl.classList.remove('selected-el'); selectedEl = el; if (selectedEl) selectedEl.classList.add('selected-el'); }
    function createCustomGroup() { let g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.classList.add('custom-element'); g.setAttribute('data-tx', 0); g.setAttribute('data-ty', 0); g.setAttribute('data-rot', 0); g.setAttribute('data-sc', 1); g.setAttribute('data-cx', 0); g.setAttribute('data-cy', 0); g.style.cursor = 'grab'; return g; }
    function applyTransform(el) { let tx = parseFloat(el.getAttribute('data-tx') || 0); let ty = parseFloat(el.getAttribute('data-ty') || 0); let rot = parseFloat(el.getAttribute('data-rot') || 0); let sc = parseFloat(el.getAttribute('data-sc') || 1); let cx = parseFloat(el.getAttribute('data-cx') || 0); let cy = parseFloat(el.getAttribute('data-cy') || 0); el.setAttribute('transform', `translate(${tx}, ${ty}) translate(${cx}, ${cy}) rotate(${rot}) scale(${sc}) translate(${-cx}, ${-cy})`); }
    function updateCenter(el) { try { let bbox = el.getBBox(); el.setAttribute('data-cx', bbox.x + bbox.width / 2); el.setAttribute('data-cy', bbox.y + bbox.height / 2); } catch (e) { } }

    svg.addEventListener('mousedown', function (evt) {
      let mode = document.getElementById('draw-mode').value; let color = document.getElementById('draw-color').value; let size = document.getElementById('draw-size').value; let pos = getMousePos(evt);
      let nodeGroup = evt.target.closest('.draggable-node');
      if (nodeGroup && mode === 'select') { isDraggingNode = true; draggedNodeId = nodeGroup.getAttribute('data-person-id'); startPt = pos; return; }
      if (mode === 'select') {
        let target = evt.target; let customParent = target.closest('.custom-element'); if (customParent) { selectElement(customParent); isDrawing = true; startPt = pos; } else { selectElement(null); }
      } else if (mode === 'text') {
        let textStr = prompt("請輸入標註文字:");
        if (textStr) { let fontSize = Math.max(12, size * 5); let g = createCustomGroup(); let text = document.createElementNS("http://www.w3.org/2000/svg", "text"); text.setAttribute('x', pos.x); text.setAttribute('y', pos.y); text.setAttribute('fill', color); text.setAttribute('font-size', fontSize); text.setAttribute('font-family', 'sans-serif'); text.textContent = textStr; text.style.userSelect = 'none'; g.appendChild(text); customLayer.appendChild(g); setTimeout(() => { updateCenter(g); selectElement(g); }, 10); } document.getElementById('draw-mode').value = 'select';
      } else if (mode === 'freehand') {
        isDrawing = true; currentDrawEl = createCustomGroup(); let path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute('fill', 'none'); path.setAttribute('stroke', color); path.setAttribute('stroke-width', size); path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round'); path.setAttribute('d', `M ${pos.x} ${pos.y}`); currentDrawEl.appendChild(path); customLayer.appendChild(currentDrawEl);
      } else if (mode === 'line') { isDrawing = true; startPt = pos; currentDrawEl = createCustomGroup(); let line = document.createElementNS("http://www.w3.org/2000/svg", "line"); line.setAttribute('stroke', color); line.setAttribute('stroke-width', size); line.setAttribute('stroke-linecap', 'round'); line.setAttribute('x1', pos.x); line.setAttribute('y1', pos.y); line.setAttribute('x2', pos.x); line.setAttribute('y2', pos.y); currentDrawEl.appendChild(line); customLayer.appendChild(currentDrawEl); }
    });
    svg.addEventListener('mousemove', function (evt) {
      let pos = getMousePos(evt);
      if (isDraggingNode && draggedNodeId && startPt) { let dx = pos.x - startPt.x; let dy = pos.y - startPt.y; if (!nodeOffsets[draggedNodeId]) nodeOffsets[draggedNodeId] = { x: 0, y: 0 }; nodeOffsets[draggedNodeId].x += dx; nodeOffsets[draggedNodeId].y += dy; startPt = pos; renderGenogram(); syncToBackend(); return; }
      if (!isDrawing) return; let mode = document.getElementById('draw-mode').value;
      if (mode === 'select' && selectedEl && startPt) {
        let dx = pos.x - startPt.x; let dy = pos.y - startPt.y; let tx = parseFloat(selectedEl.getAttribute('data-tx') || 0) + dx; let ty = parseFloat(selectedEl.getAttribute('data-ty') || 0) + dy; selectedEl.setAttribute('data-tx', tx); selectedEl.setAttribute('data-ty', ty); applyTransform(selectedEl); startPt = pos;
      } else if (mode === 'freehand' && currentDrawEl) {
        let path = currentDrawEl.querySelector('path'); let d = path.getAttribute('d'); path.setAttribute('d', d + ` L ${pos.x} ${pos.y}`);
      } else if (mode === 'line' && currentDrawEl) { let line = currentDrawEl.querySelector('line'); line.setAttribute('x2', pos.x); line.setAttribute('y2', pos.y); }
    });
    svg.addEventListener('mouseup', function (evt) {
      if (isDraggingNode) { isDraggingNode = false; draggedNodeId = null; startPt = null; return; }
      if (isDrawing && currentDrawEl) updateCenter(currentDrawEl); if (currentDrawEl) { selectElement(currentDrawEl); document.getElementById('draw-mode').value = 'select'; }
      isDrawing = false; currentDrawEl = null; startPt = null; syncToBackend();
    });
    function transformSelected(action, val) { if (!selectedEl) return alert("請先點選「👆 選取模式」，並點擊畫布上的物件。"); if (action === 'delete') { selectedEl.remove(); selectedEl = null; } else if (action === 'scale') { let sc = parseFloat(selectedEl.getAttribute('data-sc') || 1); selectedEl.setAttribute('data-sc', sc * val); } else if (action === 'rotate') { let rot = parseFloat(selectedEl.getAttribute('data-rot') || 0); selectedEl.setAttribute('data-rot', rot + val); } if (selectedEl) applyTransform(selectedEl); syncToBackend(); }
    function deleteAllCustomObjects() { if (confirm("確認刪除所有自訂標註？")) { customLayer.innerHTML = ''; selectedEl = null; syncToBackend(); } }
    function changeColorSelected() { if (selectedEl && document.getElementById('draw-mode').value === 'select') { let color = document.getElementById('draw-color').value; let children = selectedEl.children; for (let i = 0; i < children.length; i++) { if (children[i].tagName === 'text') children[i].setAttribute('fill', color); else children[i].setAttribute('stroke', color); } syncToBackend(); } }

    function getSvgSourceForExport() {
      selectElement(null);
      const svgElement = document.getElementById('genogram-svg');
      const cloneSvg = svgElement.cloneNode(true);
      const idLabels = cloneSvg.querySelectorAll('.person-id-label');
      idLabels.forEach(label => label.parentNode.removeChild(label));
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(cloneSvg);
      return '<?xml version="1.0" encoding="utf-8"?>\n' + source;
    }

    function downloadSVG() {
      const source = getSvgSourceForExport();
      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "genogram_with_notes.svg";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    // ==========================================
    // ★ Office.js 專用：將 SVG 轉換為圖片並插入 Word
    // ==========================================
    function getSvgAsBase64() {
      return new Promise((resolve) => {
        const source = getSvgSourceForExport();
        const svgElement = document.getElementById('genogram-svg');
        const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          canvas.width = svgElement.width.baseVal.value;
          canvas.height = svgElement.height.baseVal.value;
          const ctx = canvas.getContext("2d");

          // 填滿白色背景 (避免 Word 內變成透明黑底)
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);

          // 取得 base64 字串，移除前綴字元
          const b64 = canvas.toDataURL("image/png").split(',')[1];
          resolve(b64);
        };
        img.src = url;
      });
    }

    async function insertIntoWord() {
      if (typeof Word === 'undefined' || !Office.context.requirements.isSetSupported('WordApi')) {
        alert("目前不在 Word 環境中，請將此工具載入為 Word 增益集後再使用。");
        return;
      }
      try {
        const statusBar = document.getElementById('status-bar');
        statusBar.innerText = '⏳ 正在產生圖片...';
        statusBar.style.color = '#ffc107';

        // 1. 將 SVG 轉為 PNG (Base64)
        const base64Image = await getSvgAsBase64();

        // 2. 呼叫 Word API 插入圖片
        await Word.run(async (context) => {
          const body = context.document.body;
          body.insertInlinePictureFromBase64(base64Image, Word.InsertLocation.end);
          await context.sync();
        });

        statusBar.innerText = '● 已成功插入至文件';
        statusBar.style.color = '#28a745';
      } catch (error) {
        console.error(error);
        alert("插入失敗：" + error.message);
      }
    }

    renderForms();
  </script>
